<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Registry · Tessellate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   DESIGN SYSTEM TOKENS (Linear / Stripe Inspired)
   ========================================================================= */
:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --bg-app: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f5f9;
  --bg-subtle: #f1f5f9;
  --bg-muted: #e2e8f0;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-tertiary: #94a3b8;
  --text-inverse: #ffffff;

  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --border-focus: #3b82f6;

  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-subtle: #eff6ff;
  --brand-border: #bfdbfe;
  --brand-text: #1d4ed8;

  --success: #10b981;
  --success-subtle: #ecfdf5;
  --success-border: #a7f3d0;
  --success-text: #047857;

  --warning: #f59e0b;
  --warning-subtle: #fffbeb;
  --warning-border: #fde68a;
  --warning-text: #b45309;

  --danger: #ef4444;
  --danger-subtle: #fef2f2;
  --danger-border: #fecaca;
  --danger-text: #b91c1c;

  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.06);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.03);

  --sidebar-width: 240px;
  --sidebar-width-collapsed: 68px;
  --topbar-height: 56px;

  --timing-fast: 120ms;
  --timing-normal: 180ms;
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  --bg-app: #0b0f17;
  --bg-surface: #121a24;
  --bg-surface-hover: #192332;
  --bg-subtle: #192332;
  --bg-muted: #243144;

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-tertiary: #475569;
  --text-inverse: #0f172a;

  --border-subtle: #1e293b;
  --border-strong: #334155;
  --border-focus: #60a5fa;

  --brand: #3b82f6;
  --brand-hover: #60a5fa;
  --brand-subtle: #172554;
  --brand-border: #1e3a8a;
  --brand-text: #93c5fd;

  --success: #10b981;
  --success-subtle: #064e3b;
  --success-border: #047857;
  --success-text: #6ee7b7;

  --warning: #f59e0b;
  --warning-subtle: #451a03;
  --warning-border: #78350f;
  --warning-text: #fcd34d;

  --danger: #ef4444;
  --danger-subtle: #450a0a;
  --danger-border: #7f1d1d;
  --danger-text: #fca5a5;

  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.6);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.6);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6);
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg-app);color:var(--text-primary);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color var(--timing-normal) ease,color var(--timing-normal) ease}

h1,h2,h3,h4{margin:0;color:var(--text-primary);font-weight:600;letter-spacing:-0.015em}
h1{font-size:24px;line-height:1.2}
h2{font-size:18px;line-height:1.25}
h3{font-size:15px;line-height:1.3}
p{margin:0 0 12px;color:var(--text-secondary)}
.sub{color:var(--text-secondary);font-size:13px;line-height:1.4}
.sm{font-size:12px;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}

/* Layout Shell */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-width);flex:none;height:100vh;position:sticky;top:0;
  background:var(--bg-surface);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;z-index:20;
  transition:width var(--timing-normal) var(--ease-smooth);
}
.sidebar.collapsed{width:var(--sidebar-width-collapsed)}

.sidebar-header{
  height:var(--topbar-height);padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border-subtle);
}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)}
.brand-logo-mark{
  width:28px;height:28px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--brand),#4f46e5);
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex:none;
}
.brand-title{font-weight:700;font-size:16px;letter-spacing:-0.02em}
.sidebar.collapsed .brand-title{display:none}

.sidebar-nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-item{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:var(--radius-md);color:var(--text-secondary);font-weight:500;font-size:13.5px;
  transition:all var(--timing-fast) ease;position:relative;user-select:none;
}
.nav-item:hover{background:var(--bg-subtle);color:var(--text-primary)}
.nav-item[aria-current="page"]{background:var(--brand-subtle);color:var(--brand);font-weight:600}
.nav-item[aria-current="page"]::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--brand);border-radius:0 var(--radius-xs) var(--radius-xs) 0;
}
.nav-icon{display:inline-flex;align-items:center;justify-content:center;flex:none}
.sidebar.collapsed .nav-text{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}

.sidebar-footer{padding:14px 12px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px}
.dept-pill{padding:8px 10px;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:space-between}
.sidebar.collapsed .dept-pill{display:none}

.main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{
  height:var(--topbar-height);background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);
  position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
}
.topbar-actions{display:flex;align-items:center;gap:10px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.content-body{flex:1;padding:24px 32px 64px;max-width:1380px;width:100%;margin:0 auto}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-sans);font-size:13px;font-weight:500;line-height:1;
  padding:8px 14px;border-radius:var(--radius-md);border:1px solid var(--border-strong);
  background:var(--bg-surface);color:var(--text-primary);cursor:pointer;
  transition:all var(--timing-fast) ease;text-decoration:none;user-select:none;white-space:nowrap;
}
.btn:hover{background:var(--bg-surface-hover);border-color:var(--text-secondary)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#ffffff}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:#ffffff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#ffffff}
.btn-danger:hover{background:#dc2626;border-color:#dc2626;color:#ffffff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--bg-subtle);color:var(--text-primary)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:var(--radius-sm)}

/* Form Elements */
input,select,textarea{
  font-family:var(--font-sans);font-size:13px;color:var(--text-primary);
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:8px 12px;outline:none;transition:border-color var(--timing-fast) ease,box-shadow var(--timing-fast) ease;
  width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px var(--brand-subtle)}
label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;letter-spacing:0.01em}

/* Cards */
.card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-xs);margin-bottom:20px;
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0 24px}
.metric-card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:16px 20px;box-shadow:var(--shadow-xs);transition:transform var(--timing-fast) ease,box-shadow var(--timing-fast) ease;
}
.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em}
.metric-value{font-size:26px;font-weight:700;color:var(--text-primary);margin:6px 0 2px;letter-spacing:-0.02em}

/* Data Tables */
.table-container{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  overflow-x:auto;box-shadow:var(--shadow-xs);
}
table.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
table.data-table th{
  padding:10px 16px;font-weight:600;font-size:12px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:0.04em;background:var(--bg-subtle);
  border-bottom:1px solid var(--border-subtle);white-space:nowrap;
}
table.data-table td{padding:12px 16px;border-bottom:1px solid var(--border-subtle);color:var(--text-primary);vertical-align:middle}
table.data-table tr:last-child td{border-bottom:none}
table.data-table tr:hover td{background:var(--bg-surface-hover)}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:var(--radius-full);border:1px solid transparent;line-height:1.4;white-space:nowrap;
}
.badge-brand{background:var(--brand-subtle);border-color:var(--brand-border);color:var(--brand-text)}
.badge-success{background:var(--success-subtle);border-color:var(--success-border);color:var(--success-text)}
.badge-warning{background:var(--warning-subtle);border-color:var(--warning-border);color:var(--warning-text)}
.badge-neutral{background:var(--bg-subtle);border-color:var(--border-subtle);color:var(--text-secondary)}

/* Form Container */
.form-card{
  background:var(--bg-surface);border:1px solid var(--brand-border);border-radius:var(--radius-lg);
  padding:24px;margin-bottom:24px;box-shadow:var(--shadow-md);
}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

/* Toast */
.toast-box{
  position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--text-primary);color:var(--bg-surface);
  padding:12px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
  display:none;align-items:center;gap:8px;max-width:380px;animation:slideUp 0.2s ease-out;
}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Empty State */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state h3{color:var(--text-primary);margin-bottom:6px}

@media(max-width:820px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative}
  .sidebar-nav{flex-direction:row;overflow-x:auto;padding:8px}
  .content-body{padding:16px}
}
</style>
</head>

<script>
const $=s=>document.querySelector(s),R=$('#main-content');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Theme Switcher
function initTheme(){
  const saved=localStorage.getItem('tessellate_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',saved);
  updateThemeIcon(saved);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'light';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tessellate_theme',next);
  updateThemeIcon(next);
}
function updateThemeIcon(th){
  const el=$('#theme-icon');
  if(!el)return;
  if(th==='dark'){
    el.innerHTML='<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  }else{
    el.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
  }
}
initTheme();

async function api(p,o={}){
  const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status==401)location.replace('/registry-login.html');
    throw new Error(typeof j.detail=='string'?j.detail:'Something went wrong. Please try again.');
  }
  return j;
}

function toast(t,ok=true){
  const e=$('#toast');
  e.innerHTML=(ok?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>')+'<span>'+esc(t)+'</span>';
  e.style.display='flex';
  clearTimeout(toast.h);
  toast.h=setTimeout(()=>e.style.display='none',4000);
}

const API='/api/registry/';
let me=null,V='ov',ed=null,L={};
const roomsOn=()=>!!(me&&me.features&&me.features.rooms);
const TYPES='Classroom|Computer lab|Laboratory';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const ENT={
  departments:{
    title:'Departments',sub:'Central catalog of college academic departments. Departments claim their account on first sign up.',one:'Department',
    cols:[['code','ID'],['name','Name'],['category_name','Category',v=>v?`<span class="badge ${v.toLowerCase().includes('aided')?'badge-brand':'badge-warning'}">${esc(v)}</span>`:'—'],['classes','Classes'],['faculty','Faculty'],['has_account','Login account',v=>v?'<span class="badge badge-success">Active</span>':'<span class="badge badge-neutral">Not yet</span>']],
    fields:[['name','Department name','text'],['category_id','Category','sel:categories']]
  },
  faculty:{
    title:'Faculty Members',sub:'College-wide teacher roster. Any department can schedule shared faculty with conflict synchronization.',one:'Faculty Member',
    cols:[['faculty_code','ID'],['name','Name'],['department','Home department'],['designation','Designation'],['email','Email'],['sessions','Weekly Sessions',(v,r)=>`<span class="mono">${v} / ${r.max_weekly_sessions}</span>`]],
    fields:[['name','Full Name','text'],['home_department_id','Home Department','sel:departments'],['designation','Designation','text'],['email','Official College Email','text'],['max_weekly_sessions','Max Sessions / Week','number',18]]
  },
  classes:{
    title:'Classes & Sections',sub:'Official student classes and sections across all college departments.',one:'Class',
    cols:[['name','Class'],['department','Department'],['semester','Semester'],['section','Section'],['students','Students',v=>`<span class="mono">${v||0}</span>`],['home_room','Home Room'],['subjects','Subjects']],
    fields:[['name','Class Name','text'],['department_id','Department','sel:departments','','lock'],['semester','Semester','number',1],['section','Section','text','A'],['students','Student Count','number'],['home_room_id','Home Room (Optional)','sel:rooms']]
  },
  'common-slots':{
    title:'Common Time Slots',sub:'Designated college-wide scheduling periods reserved for student-selected MDC and Minor offerings.',one:'Common Slot',
    cols:[['name','Slot Label'],['day','Day',v=>DAYS[v]||v],['start_time','Start',v=>`<span class="mono">${v}</span>`],['end_time','End',v=>`<span class="mono">${v}</span>`],['applicable_course_type','Course Type',v=>`<span class="badge badge-brand">${v}</span>`],['semester','Semester']],
    fields:[['name','Slot Label','text','MDC / Minor Slot'],['day','Day of Week (0=Mon .. 6=Sun)','number',0],['start_time','Start Time (HH:MM)','text','10:00'],['end_time','End Time (HH:MM)','text','11:00'],['applicable_course_type','Course Type','sel:MDC|Minor|Both','MDC'],['semester','Semester','number',1]]
  },
  rooms:{
    title:'Rooms & Laboratories',sub:'Shared institutional facilities booked across departments with conflict detection.',one:'Room / Lab',
    cols:[['name','Room Name'],['room_type','Type',v=>`<span class="badge badge-neutral">${v}</span>`],['capacity','Capacity',v=>`<span class="mono">${v||'—'}</span>`],['sessions','Scheduled Sessions',v=>`<span class="mono">${v}</span>`]],
    fields:[['name','Room / Facility Name','text'],['room_type','Facility Type','sel:'+TYPES,'Classroom'],['capacity','Seating Capacity','number']]
  }
};

function updateNavActive(){
  document.querySelectorAll('#sidebar-nav .nav-item').forEach(b=>{
    const v=b.dataset.v;
    if(v===V)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  const titles={
    ov:'Overview',departments:'Departments',faculty:'Faculty',
    classes:'Classes','common-slots':'Common Slots',rooms:'Rooms & Labs',se:'Account'
  };
  $('#bc-title').textContent=titles[V]||'Registry';
}

async function draw(){
  updateNavActive();
  R.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading registry data...</div>';
  try{
    R.innerHTML=await page();
  }catch(e){
    R.innerHTML=`<div class="empty-state"><h3>Unable to load records</h3><p>${esc(e.message)}</p></div>`;
  }
}

async function page(){
  if(V=='ov'){
    const o=await api(API+'overview');
    return `
      <div style="margin-bottom:24px">
        <h1>College Master Registry</h1>
        <p class="sub">Central institutional data repository shared across all departments with zero privilege bias.</p>
      </div>

      <div class="stats-grid">
        <div class="metric-card">
          <div class="metric-label">Departments</div>
          <div class="metric-value">${o.departments}</div>
          <div class="sm">${o.department_accounts} accounts created</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Faculty Roster</div>
          <div class="metric-value">${o.faculty}</div>
          <div class="sm">Shared college teachers</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Classes &amp; Sections</div>
          <div class="metric-value">${o.classes}</div>
          <div class="sm">Across all batches</div>
        </div>
        ${roomsOn()?`
        <div class="metric-card">
          <div class="metric-label">Rooms &amp; Labs</div>
          <div class="metric-value">${o.rooms}</div>
          <div class="sm">Shared college facilities</div>
        </div>`:''}
        <div class="metric-card">
          <div class="metric-label">Department Subjects</div>
          <div class="metric-value">${o.subjects}</div>
          <div class="sm">Configured in timetables</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px">
        <div class="card">
          <div class="card-header">
            <h3>Registry Scope &amp; Responsibilities</h3>
          </div>
          <p class="sub" style="margin-bottom:12px">The College Registry manages the foundational shared entities that all department timetables rely on:</p>
          <ul style="padding-left:20px;color:var(--text-secondary);font-size:13px;line-height:1.7;margin:0">
            <li>Academic Departments (Aided and Self-Financing categories).</li>
            <li>College-wide faculty roster with weekly session limits.</li>
            <li>Classes, sections, and student allocations.</li>
            <li>Common time slots reserved for college-wide MDC and Minor selections.</li>
            ${roomsOn()?'<li>Shared lecture rooms and specialized laboratories.</li>':''}
          </ul>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Department Autonomy</h3>
          </div>
          <p class="sub" style="margin-bottom:12px">Tessellate guarantees equal priority and zero centralized control over department schedules:</p>
          <ul style="padding-left:20px;color:var(--text-secondary);font-size:13px;line-height:1.7;margin:0">
            <li>The Registry <strong>cannot</strong> create, view, or alter any department's timetable.</li>
            <li>Neither Aided nor Self-Financing departments receive booking priority.</li>
            <li>Cross-department resource collisions are detected and synchronized via mathematical CP-SAT satisfaction.</li>
          </ul>
        </div>
      </div>
    `;
  }

  if(V=='se'){
    return `
      <div style="margin-bottom:24px">
        <h1>Registry Account</h1>
        <p class="sub">Signed in as <strong>${esc(me.username)}</strong> · ${esc(me.email_hint||'')}</p>
      </div>

      <div class="card" style="max-width:540px">
        <div class="card-header">
          <h3>Security &amp; Password</h3>
        </div>
        <p class="sub">Update the master registry credentials. Make sure to use a strong password.</p>
        <div style="display:flex;gap:12px;margin-top:16px">
          <button class="btn btn-primary" data-a="pw">Change Password</button>
          <button class="btn btn-danger" data-a="out">Sign Out</button>
        </div>
      </div>
    `;
  }

  const E=ENT[V], rows=await api(API+V);
  for(const f of E.fields){
    if(f[2]=='sel:departments')L.departments=await api(API+'departments');
    if(f[2]=='sel:rooms')L.rooms=await api(API+'rooms');
    if(f[2]=='sel:categories')L.categories=await api(API+'categories');
  }
  L.rows=rows;
  const cur=ed&&ed!='new'?rows.find(r=>r.id==ed):null;

  return `
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div>
        <h1>${E.title}</h1>
        <p class="sub">${E.sub}</p>
      </div>
      <button class="btn btn-primary" data-a="new">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Add ${E.one}</span>
      </button>
    </div>

    ${ed?form(E,cur):''}

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap">
      <div style="position:relative;width:min(340px,100%)">
        <input id="q" placeholder="Filter ${E.title.toLowerCase()}..." aria-label="Search" style="padding-left:34px">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
      </div>
      <span class="badge badge-neutral">${rows.length} records</span>
    </div>

    ${rows.length?tab(E.cols.map(c=>c[1]).concat(['Actions']),rows.map(r=>E.cols.map(c=>c[2]?c[2](r[c[0]],r):esc(r[c[0]])).concat([`<button class="btn btn-sm btn-ghost" data-e="${r.id}">Edit</button>`]))):`
      <div class="empty-state">
        <h3>No ${E.title.toLowerCase()} configured yet</h3>
        <p class="sub">Click "+ Add ${E.one}" above to populate this catalog.</p>
      </div>
    `}
  `;
}

function opts(src,val){
  if(src=='sel:departments')return (L.departments||[]).map(d=>`<option value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)}</option>`).join('');
  if(src=='sel:rooms')return '<option value="">None</option>'+(L.rooms||[]).map(d=>`<option value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)}</option>`).join('');
  if(src=='sel:categories')return (L.categories||[]).map(c=>`<option value="${c.id}" ${c.id==val?'selected':''}>${esc(c.name)}</option>`).join('');
  return src.slice(4).split('|').map(t=>`<option ${t==val?'selected':''}>${t}</option>`).join('');
}

function form(E,cur){
  return `
    <div class="form-card">
      <div class="card-header">
        <h3>${cur?'Edit '+E.one:'Add New '+E.one}</h3>
      </div>
      <div class="form-grid">
        ${E.fields.map(([k,l,t,d,lock])=>{
          const v=cur?cur[k]:(d??'');
          const dis=cur&&lock?' disabled':'';
          return `
            <div>
              <label for="f_${k}">${esc(l)}</label>
              ${t.startsWith('sel:')?`<select id="f_${k}"${dis}>${opts(t,v)}</select>`:`<input id="f_${k}" type="${t}" value="${esc(v)}">`}
            </div>
          `;
        }).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:20px">
        <button class="btn btn-primary" data-a="save">${cur?'Save Changes':'Add '+E.one}</button>
        <button class="btn btn-ghost" data-a="cancel">Cancel</button>
        ${cur?`<button class="btn btn-danger" data-a="del" style="margin-left:auto">Delete</button>`:''}
      </div>
    </div>
  `;
}

function tab(h,rows){
  return `
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${rows.map(r=>`<tr>${r.map((c,i)=>`<td style="${i===r.length-1?'text-align:right':''}">${c}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function body(E){
  const b={};
  for(const [k,,t] of E.fields){
    const e=$('#f_'+k);
    if(!e)continue;
    let v=e.value;
    if(t=='number')v=v===''?null:+v;
    else if(k.endsWith('_id'))v=v===''?null:+v;
    b[k]=v;
  }
  return b;
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');
  if(!t)return;
  const D=t.dataset;
  try{
    if(D.v){
      V=D.v;ed=null;draw();
    }
    else if(D.e){
      ed=+D.e;await draw();window.scrollTo({top:0,behavior:'smooth'});
    }
    else if(D.a=='new'){
      ed='new';draw();
    }
    else if(D.a=='cancel'){
      ed=null;draw();
    }
    else if(D.a=='save'){
      const E=ENT[V],b=body(E);
      if(ed=='new')await api(API+V,{method:'POST',body:b});
      else await api(API+V+'/'+ed,{method:'PUT',body:b});
      toast('Saved successfully.',true);
      ed=null;draw();
    }
    else if(D.a=='del'){
      if(!confirm('Are you sure you want to delete this '+ENT[V].one+'? This action cannot be undone.'))return;
      await api(API+V+'/'+ed,{method:'DELETE'});
      toast('Deleted.',true);
      ed=null;draw();
    }
    else if(D.a=='pw'){
      const c=prompt('Current registry password:');
      if(!c)return;
      const n=prompt('New password (10+ characters with letters and numbers):');
      if(!n)return;
      await api(API+'auth/change-password',{method:'POST',body:{current:c,new:n}});
      toast('Password updated.',true);
    }
    else if(D.a=='out'){
      await api(API+'auth/logout',{method:'POST'});
      location.replace('/registry-login.html');
    }
  }catch(e){
    toast(e.message,false);
  }
});

document.addEventListener('input',ev=>{
  if(ev.target.id!='q')return;
  const q=ev.target.value.toLowerCase();
  document.querySelectorAll('tbody tr').forEach(r=>{
    r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
  });
});

api(API+'auth/me').then(r=>{
  me=r;
  if(roomsOn()){
    $('#nav-rooms').style.display='flex';
  }else{
    ENT.classes.cols=ENT.classes.cols.filter(c=>c[0]!='home_room');
    ENT.classes.fields=ENT.classes.fields.filter(f=>f[0]!='home_room_id');
    delete ENT.rooms;
  }
  draw();
}).catch(()=>location.replace('/registry-login.html'));
</script>
</body>
</html>
