<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessellate · Department Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f4ef;--panel:#fbfaf7;--ink:#1c1c1a;--mute:#7a7872;--line:#e4e1d9;--acc:#4d6a63;--accbg:#e6ece9;--lab:#ebe7dc;--warn:#9a6a1f;--crit:#a23b34;--mdc:#1f7a63;--minor:#2a5da8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#1c1c1a;--ink:#ece9e1;--mute:#97948c;--line:#2e2d2a;--acc:#8fb3a9;--accbg:#233230;--lab:#262521;--warn:#d9a54e;--crit:#e2837c;--mdc:#52b89d;--minor:#6ea0e6}}
:root[data-theme="dark"]{--bg:#161615;--panel:#1c1c1a;--ink:#ece9e1;--mute:#97948c;--line:#2e2d2a;--acc:#8fb3a9;--accbg:#233230;--lab:#262521;--warn:#d9a54e;--crit:#e2837c;--mdc:#52b89d;--minor:#6ea0e6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h2,.logo{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:32px;margin:4px 0 6px;line-height:1.15}h2{font-size:20px;margin:28px 0 12px}
.app{display:flex;min-height:100%}
nav{width:224px;padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.logo{font-size:22px;margin:0 10px 14px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:7px;color:var(--mute);min-height:38px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:500}
nav button:hover{color:var(--ink);background:rgba(0,0,0,.03)}nav button[aria-current=page]{color:var(--ink);background:var(--accbg);font-weight:600}
main{flex:1;padding:36px 44px 90px;min-width:0;max-width:1200px}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}.sm{font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:7px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--mute);background:var(--bg)}.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.p:hover{opacity:.9}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select,input,textarea{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;min-height:40px}
.stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 20px}
.stats div{flex:1 1 120px;padding:16px 12px 16px 0;border-right:1px solid var(--line)}.stats div:last-child{border-right:0}
.stats b{display:block;font:400 30px Fraunces,serif}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:20px;margin-bottom:18px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border:1px solid currentColor;border-radius:5px;padding:2px 7px;letter-spacing:.02em}
.tag.c{color:var(--crit);background:rgba(162,59,52,.08)}.tag.w{color:var(--warn);background:rgba(154,106,31,.08)}.tag.ok{color:var(--acc);background:rgba(77,106,99,.08)}
.tag.mdc{color:var(--mdc);border-color:var(--mdc);background:rgba(31,122,99,.08)}
.tag.minor{color:var(--minor);border-color:var(--minor);background:rgba(42,93,168,.08)}
.tag.reg{color:var(--mute);border-color:var(--line);background:rgba(0,0,0,.04)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:8px 14px;min-height:38px;color:var(--mute);font-size:13px;font-weight:500}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.gw{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:8px}
table.g{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed}
.g th{font-weight:600;color:var(--mute);font-size:12.5px;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.g td{border:1px solid var(--line);padding:0;height:84px;vertical-align:top;background:var(--panel)}
.g td.t{width:70px;border:0;background:var(--bg);color:var(--mute);font-size:12px;padding:10px 8px 0 0;text-align:right;font-weight:500}
.g td.br{height:28px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);color:var(--mute);font-size:11px;text-align:center;vertical-align:middle;letter-spacing:.08em;font-weight:600}
.c{padding:8px 10px;height:100%;border-left:3px solid var(--acc);display:flex;flex-direction:column;justify-content:space-between;background:var(--panel)}
.c[draggable=true]{cursor:grab}.c.c-mdc{border-left-color:var(--mdc);background:rgba(31,122,99,.04)}.c.c-minor{border-left-color:var(--minor);background:rgba(42,93,168,.04)}
.c b{display:block;font-size:13px;font-weight:600}.c span{display:block;font-size:12px;color:var(--mute)}
td.over{outline:2px dashed var(--acc);outline-offset:-3px}.fr{color:var(--mute);opacity:.6;font-size:12px;padding:8px 10px}
.bz{width:100%;height:100%;min-height:84px;font:inherit;font-size:12px;color:var(--warn);text-align:left;padding:8px 10px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--lab) 5px 6px);border:0;cursor:pointer}
.bz.off{color:var(--mute);cursor:default}
table.l{width:100%;border-collapse:collapse}.l th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:10px 10px 10px 0;border-bottom:1px solid var(--line)}.l td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:8px;max-width:92vw;z-index:99;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(22,22,21,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}.ov.on{display:flex}
.ov .box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:32px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.ov ul{list-style:none;padding:0;margin:18px 0 0;min-height:160px;color:var(--mute);font-size:14px}.ov li{padding:4px 0}
.empty{text-align:center;padding:50px 16px;color:var(--mute)}.empty h2{color:var(--ink);margin-top:0}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.bar.hi i{background:var(--warn)}.bar.ov i{background:var(--crit)}
.tg{width:100%;min-height:44px;border:0;background:var(--panel);color:var(--mute);font:inherit;font-size:12.5px;cursor:pointer;border-radius:4px}.tg:hover{color:var(--ink)}.tg.on{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--lab) 5px 6px);color:var(--warn);font-weight:600}
.chk{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:7px;min-height:40px;cursor:pointer;background:var(--panel);font-size:13.5px}
@media (max-width:860px){.app{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:20}.logo{display:none}main{padding:20px 16px 80px}.cols{grid-template-columns:1fr;gap:20px}h1{font-size:26px}}
@media print{nav,.noprint{display:none!important}main{padding:0}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast" role="status"></div>
<div class="ov" id="ov" role="dialog" aria-label="Processing"><div class="box"><div class="lab">Automated Timetable Generation</div><h1 id="ovt" style="font-size:24px">Tessellate Engine</h1><ul id="steps" aria-live="polite"></ul></div></div>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],tmn=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const STD=[['09:00','10:00'],['10:00','11:00'],['11:15','12:15'],['12:15','13:15'],['14:00','15:00'],['15:00','16:00']];
const $=s=>document.querySelector(s),R=$('#root'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={}){const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){if(r.status==401&&me){location.replace('/login.html')}throw new Error(typeof j.detail=='string'?j.detail:'Something went wrong.')}return j}
function toast(t,ok){const e=$('#toast');e.textContent=(ok?'✓ ':'⚠ ')+t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',5000)}

let me=null,V='dash',S={sel:null,dy:0,fav:null,fe:null,un:new Set(),gen:null,alt:null,rcfg:null,rdefs:null,rstale:false,ttMode:'class'};
const NAV=[
  ['dash','Overview'],
  ['su','Subjects'],
  ['ta','Teacher Assignments'],
  ['tav','Teacher Availability'],
  ['ru','Scheduling Rules'],
  ['mdc','MDC & Minor Template'],
  ['gen','Generate Timetable'],
  ['tt','Timetable'],
  ['co','Conflict Center']
];

function shell(inner){
 const cat=me&&me.department&&me.department.category;
 const catBadge=cat?`<span class="tag ${cat=='Aided'?'ok':'w'}" title="Institutional category · Equal scheduling priority">${esc(cat)}</span>`:'';
 return `<div class="app">
 <nav aria-label="Department navigation">
  <div class="logo">Tessellate</div>
  <div class="sm" style="margin:0 10px 14px;display:flex;align-items:center;justify-content:space-between">
   <span style="font-weight:600;color:var(--ink)">${esc(me.department.name)}</span>${catBadge}
  </div>
  ${NAV.map(([k,l])=>`<button data-v="${k}" ${V==k?'aria-current="page"':''}>${l}</button>`).join('')}
  <div style="margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)">
   <div style="margin-bottom:6px">Signed in as <b>${esc(me.username)}</b></div>
   <div class="row" style="gap:8px">
    <button class="btn sm" data-a="pw">Password</button>
    <button class="btn sm" data-a="out">Sign out</button>
   </div>
  </div>
 </nav>
 <main>${inner}</main>
 </div>`;
}

const head=(l,t,s,a)=>`<div class="row sp" style="align-items:flex-end;margin-bottom:20px"><div><div class="lab">${l}</div><h1>${t}</h1><p class="sub" style="margin-bottom:0">${s}</p></div>${a||''}</div>`;
const tab=(h,rows)=>`<div class="gw"><table class="l"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const catBadge=c=>c=='MDC'?'<span class="tag mdc">MDC</span>':c=='Minor'?'<span class="tag minor">Minor</span>':'<span class="tag reg">Regular</span>';

async function redraw(){const y=scrollY;try{$('main').innerHTML=await page()}catch(e){toast(e.message)}scrollTo(0,y)}
async function draw(){
 if(!me){location.replace('/login.html');return}
 R.innerHTML=shell('<p class="sub">Loading…</p>');
 try{$('main').innerHTML=await page()}catch(e){$('main').innerHTML=`<div class="empty"><h2>We couldn’t load this page</h2><p>${esc(e.message)}</p></div>`}}

async function page(){
 if(V=='dash') return viewOverview();
 if(V=='su') return viewSubjects();
 if(V=='ta') return viewTeacherAssignments();
 if(V=='tav') return viewTeacherAvailability();
 if(V=='ru') return viewSchedulingRules();
 if(V=='mdc') return viewMdcTemplate();
 if(V=='gen') return viewGenerateTimetable();
 if(V=='tt') return viewTimetable();
 if(V=='co') return viewConflictCenter();
 return viewOverview();
}

/* 1. OVERVIEW VIEW */
async function viewOverview(){
 const [d, allocs, fac, conf] = await Promise.all([
  api('/api/dashboard'),
  api('/api/allocations'),
  api('/api/faculty'),
  api('/api/conflicts')
 ]);
 const assignedTeachers = new Set(allocs.map(a=>a.faculty_id)).size;
 const issuesCount = conf.items?conf.items.length:0;
 const cat = me.department.category;
 
 return head('Department Workspace', `${esc(me.department.name)} Department`, `Institutional Category: ${esc(cat)} · Guaranteed Equal Scheduling Priority`,
  `<button class="btn p noprint" data-v="gen">Generate Timetable</button>`)+
 `<div class="stats">
   <div><b>${allocs.length}</b><span class="sm">Subjects Offered</span></div>
   <div><b>${assignedTeachers}</b><span class="sm">Assigned Teachers</span></div>
   <div><b>${d.sessions||0}</b><span class="sm">Scheduled Sessions</span></div>
   <div><b style="color:${issuesCount>0?'var(--crit)':'var(--acc)'}">${issuesCount===0?'0 Clashes':issuesCount+' Issues'}</b><span class="sm">Conflict Status</span></div>
 </div>
 <div class="cols">
  <div>
   <h2>Quick Actions</h2>
   <div class="card">
    <p class="sm" style="margin-top:0">Essential steps for generating a conflict-free department timetable:</p>
    <div class="item row sp">
     <div><b>1. Subject Management</b><div class="sm">Add regular, MDC and Minor subjects offered this semester.</div></div>
     <button class="btn sm" data-v="su">Manage Subjects</button>
    </div>
    <div class="item row sp">
     <div><b>2. Teacher Assignments</b><div class="sm">Assign teachers and review cross-department workloads.</div></div>
     <button class="btn sm" data-v="ta">View Teachers</button>
    </div>
    <div class="item row sp">
     <div><b>3. MDC &amp; Minor Template</b><div class="sm">Place MDC and Minor offerings into college-wide common slots.</div></div>
     <button class="btn sm" data-v="mdc">Common Template</button>
    </div>
    <div class="item row sp">
     <div><b>4. Generate Timetable</b><div class="sm">Solve teacher constraints and produce a valid schedule.</div></div>
     <button class="btn sm p" data-v="gen">Generate</button>
    </div>
   </div>
  </div>
  <div>
   <h2>Coordination &amp; Synchronization Status</h2>
   <div class="card">
    <div class="item">
     <div class="row sp"><b>Teacher Availability</b><span class="tag ok sm">Synchronized</span></div>
     <p class="sm" style="margin:4px 0 0">All ${fac.length} college faculty records are checked college-wide. Teachers can never be assigned simultaneously across departments.</p>
    </div>
    <div class="item">
     <div class="row sp"><b>MDC &amp; Minor Slots</b><span class="tag mdc sm">Common Template</span></div>
     <p class="sm" style="margin:4px 0 0">MDC and Minor subjects strictly respect college-wide synchronized time slots to prevent student schedule collisions.</p>
    </div>
    <div class="item">
     <div class="row sp"><b>Cross-Department Isolation</b><span class="tag ok sm">Enforced</span></div>
     <p class="sm" style="margin:4px 0 0">Generating or updating your timetable will never silently overwrite or modify another department's existing schedule.</p>
    </div>
   </div>
  </div>
 </div>`;
}

/* 2. SUBJECTS VIEW */
async function viewSubjects(){
 const [allocs, classes, faculty] = await Promise.all([
  api('/api/allocations'),
  api('/api/classes'),
  api('/api/faculty')
 ]);
 
 const form = `<div class="card noprint">
  <h2 style="margin-top:0">Add Department Subject</h2>
  <div class="row" style="gap:14px">
   <label style="flex:1 1 200px">Subject Name<br><input id="s_name" placeholder="e.g. Data Structures" style="width:100%"></label>
   <label style="flex:1 1 120px">Subject Code<br><input id="s_code" placeholder="e.g. CS-201" style="width:100%"></label>
   <label style="flex:1 1 140px">Course Category<br>
    <select id="s_cat" style="width:100%">
     <option value="Regular">Regular</option>
     <option value="MDC">MDC</option>
     <option value="Minor">Minor</option>
    </select>
   </label>
   <label style="flex:1 1 160px">Class (from Registry)<br>
    <select id="s_cls" style="width:100%">
     ${classes.length?classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''):'<option value="">No classes configured in Registry</option>'}
    </select>
   </label>
   <label style="flex:1 1 180px">Assigned Teacher<br>
    <select id="s_fac" style="width:100%">
     ${faculty.map(f=>`<option value="${f.id}">${esc(f.name)} (${f.faculty_code} · ${esc(f.department)})</option>`).join('')}
    </select>
   </label>
   <label style="flex:0 0 100px">Sessions/Wk<br><input id="s_sess" type="number" min="1" max="10" value="3" style="width:100%"></label>
   <label style="flex:0 0 110px">Duration<br>
    <select id="s_dur" style="width:100%">
     <option value="60">60 min</option>
     <option value="45">45 min</option>
     <option value="90">90 min</option>
    </select>
   </label>
   <label style="align-self:flex-end"><button class="btn p" data-a="addsub">Add Subject</button></label>
  </div>
  <div class="row" style="margin-top:14px;gap:12px;font-size:12.5px;color:var(--mute)">
   <div><span class="tag reg">Regular</span> Scheduled within department's regular timetable.</div>
   <div><span class="tag mdc">MDC</span> Assigned to college-wide MDC common time slots.</div>
   <div><span class="tag minor">Minor</span> Assigned to college-wide Minor common time slots.</div>
  </div>
 </div>`;

 const rows = allocs.map(a=>[
  `<b>${esc(a.subject_code||'—')}</b>`,
  esc(a.subject),
  catBadge(a.course_category),
  esc(a.class_name),
  `${esc(a.teacher)} <span class="sm">(${a.faculty_code})</span>`,
  `${a.sessions_per_week} sess/wk`,
  `${a.duration||60} min`,
  `<b>${a.placed}</b> / ${a.sessions_per_week} placed`,
  `<div class="row" style="gap:6px">
     <button class="btn sm" data-a="delsub" data-id="${a.id}">Delete</button>
   </div>`
 ]);

 return head('Curriculum', 'Subject Management', 'Each department adds and manages the subjects it offers. Categorize as Regular, MDC, or Minor.')+
  form+
  (allocs.length?tab(['Code','Subject Name','Category','Class','Assigned Teacher','Sessions','Duration','Status','Actions'], rows):
   `<div class="empty"><h2>No subjects defined yet</h2><p>Use the form above to add your first subject offering.</p></div>`);
}

/* 3. TEACHER ASSIGNMENTS VIEW */
async function viewTeacherAssignments(){
 const [faculty, allocs] = await Promise.all([
  api('/api/faculty'),
  api('/api/allocations')
 ]);
 
 const rows = faculty.map(f=>{
  const mySubs = allocs.filter(a=>a.faculty_id==f.id);
  const mySubText = mySubs.length?mySubs.map(a=>`${esc(a.subject)} (${a.sessions_per_week}s)`).join(', '):'<span class="sm">None</span>';
  const otherDepts = (f.allocations_by_dept||[]).filter(x=>x.department!=me.department.name);
  const otherText = otherDepts.length?otherDepts.map(x=>`<b>${esc(x.department)}:</b> ${x.sessions}s`).join(' · '):'<span class="sm">No other depts</span>';
  const pct = Math.min(100, Math.round((f.sessions / f.max_weekly_sessions) * 100));
  const barClass = pct >= 100 ? 'ov' : pct >= 80 ? 'hi' : '';
  
  return [
   `<b>${esc(f.name)}</b> <span class="sm">(${f.faculty_code})</span>`,
   esc(f.department),
   esc(f.designation||'Faculty'),
   mySubText,
   otherText,
   `<div><b>${f.sessions}</b> / ${f.max_weekly_sessions} sessions<div class="bar ${barClass}"><i style="width:${pct}%"></i></div></div>`,
   `<div class="row"><button class="btn sm" data-v="tav" data-fid="${f.id}">View Availability</button></div>`
  ];
 });

 return head('Faculty Management', 'Teacher Assignments &amp; Workload', 'College-wide teacher registry. Teachers are shared across departments and never double-booked.')+
  `<div class="card" style="margin-bottom:20px">
    <div class="row sp">
     <div><b>Centralized Teacher Coordination Rule</b><div class="sm">Each teacher has one global identity across the college. When another department assigns a teacher, that period becomes occupied college-wide.</div></div>
     <span class="tag ok">Cross-College Sync Active</span>
    </div>
   </div>`+
  tab(['Teacher Name','Home Department','Designation',`Assigned in ${esc(me.department.name)}`,'Other Dept Commitments','Total College Load','Actions'], rows);
}

/* 4. TEACHER AVAILABILITY VIEW */
async function viewTeacherAvailability(){
 const faculty = await api('/api/faculty');
 if(!S.fav && faculty.length) S.fav = faculty[0].id;
 const curFac = faculty.find(f=>f.id==S.fav) || faculty[0];
 const av = curFac ? await api(`/api/faculty/${curFac.id}/availability`) : [];
 const base = curFac ? await api(`/api/faculty/${curFac.id}/base-availability`) : [];
 S.un = new Set(base.filter(c=>c.state=='unavailable').map(c=>c.day+','+c.period));

 const g = gridRows(av);
 const cell = (d, p) => {
  const c = av.find(x=>x.day==d && x.period==p);
  if(c && c.state=='busy') {
   return `<div class="bz off" title="${esc(c.reason)}">Busy (Teaching)</div>`;
  }
  const on = S.un.has(d+','+p);
  return `<button type="button" class="tg ${on?'on':''}" data-un="${d},${p}" aria-pressed="${on}">${on?'Unavailable':'Available'}</button>`;
 };

 let gridHtml = `<div class="gw"><table class="g" style="min-width:600px"><thead><tr><th></th>${g.days.map(d=>`<th>${DAYS[d].slice(0,3)}</th>`).join('')}</tr></thead><tbody>`;
 for(const p of g.pers){
  gridHtml += `<tr><td class="t">${g.lab(p)}</td>${g.days.map(d=>`<td style="height:50px">${cell(d,p)}</td>`).join('')}</tr>`;
 }
 gridHtml += `</tbody></table></div>`;

 return head('Faculty Constraints', 'Teacher Availability', 'Define when teachers are available or unavailable. The scheduler strictly respects these rules.')+
  `<div class="card noprint">
    <div class="row sp">
     <div class="row" style="gap:12px">
      <label><b>Select Teacher:</b><br>
       <select id="fav_sel" style="min-width:260px">

       </select>
      </label>
      <div style="align-self:flex-end">
       <span class="sm">Home Department: <b>${esc(curFac.department)}</b> · Scheduled: <b>${curFac.sessions}</b> / ${curFac.max_weekly_sessions} sessions</span>
      </div>
     </div>
     <div style="align-self:flex-end">
      <button class="btn p" data-a="savetav">Save Availability Changes</button>
     </div>
    </div>
   </div>
   <div class="card" style="margin-top:14px">
    <p class="sm" style="margin:0 0 10px">Click any slot to toggle between <b>Available</b> and <b>Unavailable</b>. Slots marked <b>Busy (Teaching)</b> are locked by active scheduled classes.</p>
    ${gridHtml}
   </div>`;
}

function gridRows(a){
 const days=[...new Set(a.map(x=>x.day))].sort((x,y)=>x-y);
 const pers=[...new Set(a.map(x=>x.period))].sort((x,y)=>x-y);
 return {days, pers, lab:p=>{const c=a.find(x=>x.period==p); return c?c.start:''}};
}

/* 8. TIMETABLE VIEW */
async function viewTimetable(){
 const [classes, faculty, st] = await Promise.all([
  api('/api/classes'),
  api('/api/faculty'),
  api('/api/settings')
 ]);
 const cfg = st.config;
 const mode = S.ttMode || 'class';
 let ents = mode=='class' ? classes.map(c=>[c.id, c.name]) : faculty.map(f=>[f.id, `${f.name} (${f.faculty_code})`]);
 
 if(!ents.some(e=>e[0]==S.sel)) S.sel = ents.length ? ents[0][0] : null;
 const url = mode=='class' ? `/api/timetable/${S.sel}` : `/api/faculty/${S.sel}/timetable`;
 const rows = S.sel ? await api(url) : [];
 
 const prs = cfg.periods.map((p,i)=>({s:p.start, e:p.end, p:i}));
 const seen = new Set(), other = [];
 rows.forEach(r=>{const k=r.start+'-'+r.end; if(!seen.has(k)){seen.add(k); other.push({s:r.start, e:r.end, p:-1})}});
 const known = new Set(prs.map(r=>r.s+'-'+r.e));
 let rws = mode=='class' ? prs.concat(other.filter(o=>!known.has(o.s+'-'+o.e))) : (other.length?other:prs);
 rws = rws.sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);
 const days = [...new Set(cfg.days.concat(rows.map(r=>r.day)))].sort((a,b)=>a-b);
 
 const cell = (d, r) => {
  const e = rows.find(x=>x.day==d && x.start==r.s && x.end==r.e);
  if(!e) return '<div class="fr">'+((cfg.free||[]).some(f=>f[0]==d&&f[1]==r.p)?'Kept free':'Free')+'</div>';
  const isMdc = e.course_type=='MDC';
  const isMinor = e.course_type=='Minor';
  const cardClass = isMdc ? 'c-mdc' : isMinor ? 'c-minor' : '';
  return `<div class="c ${cardClass}" ${mode=='class'?`draggable="true" data-id="${e.id}"`:''} tabindex="0">
   <div class="row sp"><b>${esc(e.subject)}</b>${isMdc?'<span class="tag mdc sm">MDC</span>':isMinor?'<span class="tag minor sm">Minor</span>':''}</div>
   <span>${esc(mode=='class'?e.teacher:e.class_name)}</span>
  </div>`;
 };

 let gridHtml = `<div class="gw"><table class="g"><thead><tr><th></th>${days.map(d=>`<th>${DAYS[d]}</th>`).join('')}</tr></thead><tbody>`;
 let prev = null;
 for(const r of rws){
  if(prev && tmn(r.s)-tmn(prev.e)>=5) gridHtml += `<tr><td class="t"></td><td class="br" colspan="${days.length}">BREAK · ${tmn(r.s)-tmn(prev.e)} MIN</td></tr>`;
  gridHtml += `<tr><td class="t">${r.s}<br>${r.e}</td>${days.map(d=>`<td ${r.p>=0&&mode=='class'?`data-d="${d}" data-p="${r.p}"`:''}>${cell(d,r)}</td>`).join('')}</tr>`;
  prev = r;
 }
 gridHtml += `</tbody></table></div>`;

 return head('Schedule Review', 'Department Timetable', mode=='class'?'Drag a session to another period to move it. Cross-college teacher availability is checked instantly.':'Shared college faculty timetable view.',
  `<div class="row"><button class="btn" data-a="print">Print</button><button class="btn p" data-v="gen">Generate</button></div>`)+
  `<div class="row noprint" style="margin-bottom:14px;gap:12px">
    <div class="seg" role="group" aria-label="View mode">
     <button data-ttmode="class" aria-pressed="${mode=='class'}">View by Class</button>
     <button data-ttmode="teacher" aria-pressed="${mode=='teacher'}">View by Teacher</button>
    </div>
    <select id="tt_sel" style="min-width:240px">
     ${ents.map(([i,n])=>`<option value="${i}" ${i==S.sel?'selected':''}>${esc(n)}</option>`).join('')}
    </select>
   </div>
   ${gridHtml}`;
}

function run(fn){
 const ov=$('#ov'),ul=$('#steps'),st=['Checking faculty availability…','Checking shared college allocations…','Synchronizing MDC & Minor slots…','Solving timetable constraints…','Finalizing schedule…'];
 $('#ovt').textContent=me.department.name; ul.innerHTML=''; ov.classList.add('on');
 let i=0; const iv=setInterval(()=>{if(i<st.length)ul.insertAdjacentHTML('beforeend',`<li>${st[i++]}</li>`)},350);
 fn().then(r=>{
  clearInterval(iv);
  ul.insertAdjacentHTML('beforeend', r.status=='ok'?`<li>✓ Timetable ready · no clashes</li>`:'<li>We couldn’t fit every session</li>');
  setTimeout(()=>{ov.classList.remove('on'); S.gen=r; if(r.status!='ok') V='co'; else V='tt'; draw()},1000);
 }).catch(e=>{
  clearInterval(iv); ov.classList.remove('on'); toast(e.message);
 });
}

/* EVENT HANDLERS */
document.addEventListener('click', async ev=>{
 const t=ev.target.closest('button, [data-a]'); if(!t) return;
 const D=t.dataset;
 try{
  if(D.v){V=D.v; S.fav=D.fid||S.fav; draw()}
  else if(D.ttmode){S.ttMode=D.ttmode; S.sel=null; draw()}
  else if(D.a=='addsub'){
   const name=$('#s_name').value.trim(); if(!name) return toast('Please enter a subject name.');
   const code=$('#s_code').value.trim();
   const cat=$('#s_cat').value;
   const cid=+$('#s_cls').value; if(!cid) return toast('Please select a class.');
   const fid=+$('#s_fac').value;
   const sess=+$('#s_sess').value;
   const dur=+$('#s_dur').value;
   await api('/api/allocations',{method:'POST',body:{class_id:cid,subject:name,code:code,course_category:cat,faculty_id:fid,sessions:sess,duration:dur}});
   toast('Subject added successfully.',1); redraw();
  }
  else if(D.a=='delsub'){
   if(!confirm('Delete this subject offering?')) return;
   await api('/api/allocations/'+D.id, {method:'DELETE'});
   toast('Subject deleted.',1); redraw();
  }
  else if(D.un){
   if(S.un.has(D.un)) S.un.delete(D.un); else S.un.add(D.un);
   const on=S.un.has(D.un); t.classList.toggle('on',on); t.setAttribute('aria-pressed',on); t.textContent=on?'Unavailable':'Available';
  }
  else if(D.a=='savetav'){
   await api('/api/faculty/'+S.fav+'/unavailable',{method:'PUT',body:{slots:[...S.un].map(k=>k.split(',').map(Number))}});
   toast('Teacher availability saved.',1); redraw();
  }
  else if(D.a=='saverules'){
   const c=S.rcfg, rules={};
   for(const [k,df] of Object.entries(S.rdefs)){
    const r=c.rules[k]||{mode:'off'};
    rules[k]={mode:r.mode};
    if(df.param) rules[k][df.param.key]=+(r[df.param.key]??df.param.default);
   }
   const r=await api('/api/settings',{method:'PUT',body:{days:c.days,periods:c.periods,rules,free:c.free}});
   S.rcfg=JSON.parse(JSON.stringify(r.config)); S.rstale=r.stale;
   toast('Rules saved. Generate timetable to apply them.',1); redraw();
  }
  else if(D.a=='assignslot'){
   const sid=+D.sid; const subSel=$('#slot_sub_'+sid); if(!subSel || !subSel.value) return toast('Please select an offering first.');
   await api('/api/common-slots/assign',{method:'POST',body:{common_slot_id:sid,subject_id:+subSel.value}});
   toast('Assigned to common slot.',1); redraw();
  }
  else if(D.a=='unassignslot'){
   await api('/api/common-slots/assign/'+D.id, {method:'DELETE'});
   toast('Removed from common slot.',1); redraw();
  }
  else if(D.a=='gen'){run(()=>api('/api/generate',{method:'POST',body:{}}))}
  else if(D.a=='print'){print()}
  else if(D.a=='out'){await api('/api/auth/logout',{method:'POST'}); location.replace('/login.html')}
  else if(D.a=='pw'){
   const c=prompt('Current password:'); if(!c) return;
   const n=prompt('New password (min 6 characters):'); if(!n) return;
   await api('/api/auth/change-password',{method:'POST',body:{current:c,new:n}});
   toast('Password updated.',1);
  }
  else if(D.free){
   const [d,p]=D.free.split(',').map(Number), c=S.rcfg, i=c.free.findIndex(f=>f[0]==d&&f[1]==p);
   if(i>=0) c.free.splice(i,1); else c.free.push([d,p]);
   const on=i<0; t.classList.toggle('on',on); t.setAttribute('aria-pressed',on); t.textContent=on?'Kept free':'Use';
  }
  else if(D.a=='rmper'){
   const c=S.rcfg; c.periods.splice(+D.i,1); c.free=c.free.filter(f=>f[1]<c.periods.length); redraw();
  }
  else if(D.a=='addper'){
   const c=S.rcfg, l=c.periods[c.periods.length-1], st=l?tmn(l.end)+15:540, en=st+60;
   if(en>1439||c.periods.length>=12) return toast('No room for another period today.');
   const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
   c.periods.push({start:f(st),end:f(en)}); redraw();
  }
  else if(D.a=='preset'){
   S.rcfg.periods=STD.map(([a,b])=>({start:a,end:b})); S.rcfg.free=S.rcfg.free.filter(f=>f[1]<6); redraw();
  }
 }catch(e){toast(e.message)}
});

document.addEventListener('change', ev=>{
 const t=ev.target, D=t.dataset;
 if(t.id=='fav_sel'){S.fav=+t.value; redraw()}
 else if(t.id=='tt_sel'){S.sel=t.value; draw()}
 else if(D.rd!==undefined){
  const c=S.rcfg, d=+D.rd;
  if(t.checked) c.days=[...new Set(c.days.concat(d))].sort();
  else {
   if(c.days.length<2){t.checked=true; return toast('Keep at least one working day.')}
   c.days=c.days.filter(x=>x!=d); c.free=c.free.filter(f=>f[0]!=d);
  }
  redraw();
 }
 else if(D.pt){
  const [i,k]=D.pt.split(':'); if(t.value){S.rcfg.periods[+i][k]=t.value; redraw()}
 }
 else if(D.rm){
  S.rcfg.rules[D.rm]=Object.assign(S.rcfg.rules[D.rm]||{},{mode:t.value}); redraw();
 }
 else if(D.rp){
  S.rcfg.rules[D.rp]=Object.assign(S.rcfg.rules[D.rp]||{mode:'prefer'},{[S.rdefs[D.rp].param.key]:+t.value});
 }
});

let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-id]');if(c)drag=c.dataset.id});
document.addEventListener('dragover',e=>{const td=e.target.closest('td[data-d]');if(td&&drag){e.preventDefault();td.classList.add('over')}});
document.addEventListener('dragleave',e=>e.target.closest&&e.target.closest('td')?.classList.remove('over'));
document.addEventListener('drop',async e=>{
 const td=e.target.closest('td[data-d]'); if(!td||!drag) return;
 e.preventDefault(); const id=drag; drag=null;
 const body={day:+td.dataset.d, period:+td.dataset.p};
 try{
  await api(`/api/entries/${id}/move`,{method:'POST',body});
  toast('Session moved.',1); draw();
 }catch(er){
  toast(er.message); draw();
 }
});

api('/api/auth/me').then(r=>{me=r; draw()}).catch(()=>location.replace('/login.html'));
</script></body></html>
