<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TESSellate · College Timetable &amp; Resource Synchronization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   1. DESIGN SYSTEM TOKENS (Linear / Stripe Inspired)
   ========================================================================= */
:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Neutral Surface Palette - Light Mode */
  --bg-app: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f5f9;
  --bg-subtle: #f1f5f9;
  --bg-muted: #e2e8f0;
  
  /* Text Colors */
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-tertiary: #94a3b8;
  --text-inverse: #ffffff;

  /* Borders */
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --border-focus: #3b82f6;

  /* Brand Accent: Sophisticated Royal Indigo / Blue */
  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-subtle: #eff6ff;
  --brand-border: #bfdbfe;
  --brand-text: #1d4ed8;

  /* Semantic Feedback */
  --success: #10b981;
  --success-subtle: #ecfdf5;
  --success-border: #a7f3d0;
  --success-text: #047857;

  --warning: #f59e0b;
  --warning-subtle: #fffbeb;
  --warning-border: #fde68a;
  --warning-text: #b45309;

  --danger: #ef4444;
  --danger-subtle: #fef2f2;
  --danger-border: #fecaca;
  --danger-text: #b91c1c;

  /* Course Category Badges */
  --badge-mdc-bg: #fff1f2;
  --badge-mdc-border: #fecdd3;
  --badge-mdc-text: #e11d48;
  --badge-minor-bg: #fffbeb;
  --badge-minor-border: #fde68a;
  --badge-minor-text: #b45309;
  --badge-reg-bg: #f0fdf4;
  --badge-reg-border: #bbf7d0;
  --badge-reg-text: #15803d;

  /* Geometry & Elevation */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.06);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.03);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.04);

  --sidebar-width: 240px;
  --sidebar-width-collapsed: 68px;
  --topbar-height: 56px;

  --timing-fast: 120ms;
  --timing-normal: 180ms;
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  --bg-app: #0b0f17;
  --bg-surface: #121a24;
  --bg-surface-hover: #192332;
  --bg-subtle: #192332;
  --bg-muted: #243144;

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-tertiary: #475569;
  --text-inverse: #0f172a;

  --border-subtle: #1e293b;
  --border-strong: #334155;
  --border-focus: #60a5fa;

  --brand: #3b82f6;
  --brand-hover: #60a5fa;
  --brand-subtle: #172554;
  --brand-border: #1e3a8a;
  --brand-text: #93c5fd;

  --success: #10b981;
  --success-subtle: #064e3b;
  --success-border: #047857;
  --success-text: #6ee7b7;

  --warning: #f59e0b;
  --warning-subtle: #451a03;
  --warning-border: #78350f;
  --warning-text: #fcd34d;

  --danger: #ef4444;
  --danger-subtle: #450a0a;
  --danger-border: #7f1d1d;
  --danger-text: #fca5a5;

  --badge-mdc-bg: #3f101a;
  --badge-mdc-border: #881337;
  --badge-mdc-text: #fda4af;
  --badge-minor-bg: #3b2204;
  --badge-minor-border: #78350f;
  --badge-minor-text: #fde68a;
  --badge-reg-bg: #072e1c;
  --badge-reg-border: #14532d;
  --badge-reg-text: #86efac;

  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.6);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.6);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.7);
}

/* Base Styles */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg-app);color:var(--text-primary);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color var(--timing-normal) ease,color var(--timing-normal) ease}

h1,h2,h3,h4,h5{margin:0;color:var(--text-primary);font-weight:600;letter-spacing:-0.015em}
h1{font-size:24px;line-height:1.2}
h2{font-size:18px;line-height:1.25}
h3{font-size:15px;line-height:1.3}
p{margin:0 0 12px;color:var(--text-secondary)}
.sub{color:var(--text-secondary);font-size:13px;line-height:1.4}
.sm{font-size:12px;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}

/* Layout Shell */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-width);flex:none;height:100vh;position:sticky;top:0;
  background:var(--bg-surface);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;z-index:20;
  transition:width var(--timing-normal) var(--ease-smooth);
}
.sidebar.collapsed{width:var(--sidebar-width-collapsed)}

.sidebar-header{
  height:var(--topbar-height);padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border-subtle);
}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)}
.brand-logo-mark{
  width:28px;height:28px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--brand),#4f46e5);
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex:none;
}
.brand-title{font-weight:700;font-size:16px;letter-spacing:-0.02em}
.sidebar.collapsed .brand-title{display:none}

.sidebar-nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-item{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:var(--radius-md);color:var(--text-secondary);font-weight:500;font-size:13.5px;
  transition:all var(--timing-fast) ease;position:relative;user-select:none;
}
.nav-item:hover{background:var(--bg-subtle);color:var(--text-primary)}
.nav-item[aria-current="page"]{background:var(--brand-subtle);color:var(--brand);font-weight:600}
.nav-item[aria-current="page"]::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--brand);border-radius:0 var(--radius-xs) var(--radius-xs) 0;
}
.nav-icon{display:inline-flex;align-items:center;justify-content:center;flex:none}
.sidebar.collapsed .nav-text{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}

.sidebar-footer{padding:12px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:4px}
.dept-pill{
  background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:8px 10px;display:flex;align-items:center;justify-content:space-between;
}
.sidebar.collapsed .dept-pill{display:none}

/* Main Area & Topbar */
.main-wrapper{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-app)}
.topbar{
  height:var(--topbar-height);padding:0 28px;background:var(--bg-surface);
  border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:15;
}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13.5px}
.topbar-actions{display:flex;align-items:center;gap:10px}

.content-body{padding:28px 32px 80px;flex:1;max-width:1440px;width:100%;margin:0 auto}

/* Design System Buttons */
.btn{
  font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;padding:0 14px;height:36px;
  border-radius:var(--radius-md);border:1px solid var(--border-subtle);background:var(--bg-surface);
  color:var(--text-primary);box-shadow:var(--shadow-xs);transition:all var(--timing-fast) ease;
  user-select:none;white-space:nowrap;
}
.btn:hover{background:var(--bg-subtle);border-color:var(--border-strong);color:var(--text-primary)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
.btn.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 1px 3px 0 rgba(37,99,235,0.25)}
.btn.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.btn-danger:hover{background:#dc2626}
.btn.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.btn-ghost:hover{background:var(--bg-subtle)}
.btn.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:var(--radius-sm)}
.btn.btn-lg{height:42px;padding:0 18px;font-size:14.5px;border-radius:var(--radius-lg)}
.btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}

/* Design System Inputs & Controls */
input,select,textarea{
  font:inherit;font-size:13.5px;color:var(--text-primary);background:var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:36px;
  padding:0 12px;outline:none;transition:border-color var(--timing-fast) ease,box-shadow var(--timing-fast) ease;
  box-shadow:var(--shadow-xs);width:100%;
}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
textarea{height:auto;padding:10px 12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

/* Cards & Surfaces */
.card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xs);padding:20px;transition:box-shadow var(--timing-normal) ease;
}
.card:hover{box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

/* Badges & Pills */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:11.5px;
  font-weight:600;border-radius:var(--radius-full);line-height:1.3;
}
.badge-brand{background:var(--brand-subtle);color:var(--brand-text);border:1px solid var(--brand-border)}
.badge-success{background:var(--success-subtle);color:var(--success-text);border:1px solid var(--success-border)}
.badge-warning{background:var(--warning-subtle);color:var(--warning-text);border:1px solid var(--warning-border)}
.badge-danger{background:var(--danger-subtle);color:var(--danger-text);border:1px solid var(--danger-border)}
.badge-neutral{background:var(--bg-subtle);color:var(--text-secondary);border:1px solid var(--border-subtle)}

/* Segmented Control & Subtabs */
.segmented-tabs{display:inline-flex;background:var(--bg-subtle);padding:3px;border-radius:var(--radius-md);gap:2px}
.segmented-tab{
  all:unset;cursor:pointer;padding:6px 14px;font-size:13px;font-weight:500;
  color:var(--text-secondary);border-radius:var(--radius-sm);transition:all var(--timing-fast) ease;
}
.segmented-tab:hover{color:var(--text-primary)}
.segmented-tab.active{background:var(--bg-surface);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow-xs)}

/* Professional Data Tables */
.table-container{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  overflow-x:auto;box-shadow:var(--shadow-xs);
}
table.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:13.5px}
.data-table th{
  padding:12px 16px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;
  color:var(--text-muted);border-bottom:1px solid var(--border-subtle);background:var(--bg-subtle);white-space:nowrap;
}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--border-subtle);color:var(--text-primary);vertical-align:middle}
.data-table tbody tr:hover{background:var(--bg-surface-hover)}
.data-table tbody tr:last-child td{border-bottom:none}

/* Search Bar in Tables */
.table-toolbar{
  padding:14px 16px;border-bottom:1px solid var(--border-subtle);display:flex;
  align-items:center;justify-content:space-between;gap:12px;background:var(--bg-surface);flex-wrap:wrap;
}
.search-input-wrapper{position:relative;width:280px;max-width:100%}
.search-input-wrapper input{padding-left:34px;height:34px;font-size:13px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

/* Timetable Editor Specific Styling */
.tt-workspace{display:flex;gap:20px;align-items:flex-start}
.tt-grid-area{flex:1;min-width:0}
.tt-header-toolbar{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;box-shadow:var(--shadow-xs);
}

.tt-grid-table{
  border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed;
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;
}
.tt-grid-table th{
  padding:12px 10px;text-align:center;font-weight:600;font-size:12.5px;
  color:var(--text-secondary);background:var(--bg-subtle);border-bottom:1px solid var(--border-subtle);
}
.tt-grid-table th.time-col{width:86px;text-align:right;padding-right:12px}
.tt-grid-table td{
  border:1px solid var(--border-subtle);padding:6px;height:98px;vertical-align:top;
  background:var(--bg-surface);transition:background var(--timing-fast) ease;position:relative;
}
.tt-grid-table td.time-cell{
  background:none;border-left:none;border-right:1px solid var(--border-subtle);
  color:var(--text-muted);font-size:12px;padding:10px 12px 0 0;text-align:right;
}
.tt-grid-table td.break-cell{
  height:28px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--bg-subtle) 6px 7px);
  color:var(--text-muted);font-size:11px;text-align:center;vertical-align:middle;font-weight:500;letter-spacing:0.06em;
}
.tt-grid-table td.drag-target-over{
  outline:2px dashed var(--brand);outline-offset:-2px;background:var(--brand-subtle)!important;
}

/* Timetable Cards */
.session-card{
  padding:9px 10px;height:100%;border-radius:var(--radius-md);background:var(--bg-surface);
  border:1px solid var(--border-subtle);border-left:3.5px solid var(--brand);
  box-shadow:var(--shadow-xs);cursor:grab;display:flex;flex-direction:column;justify-content:space-between;
  transition:transform var(--timing-fast) ease,box-shadow var(--timing-fast) ease,border-color var(--timing-fast) ease;
  user-select:none;position:relative;
}
.session-card:hover{
  box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong);
}
.session-card:active{cursor:grabbing;transform:scale(0.98);box-shadow:var(--shadow-lg)}
.session-card.card-mdc{border-left-color:var(--badge-mdc-text);background:var(--badge-mdc-bg)}
.session-card.card-minor{border-left-color:var(--badge-minor-text);background:var(--badge-minor-bg)}
.session-card.card-lab{border-left-color:#0284c7;background:#f0f9ff}
.session-card.pending-change{
  box-shadow:0 0 0 2px var(--warning);animation:pulsePending 1.6s infinite alternate;
}
@keyframes pulsePending{
  from{box-shadow:0 0 0 1.5px var(--warning)}
  to{box-shadow:0 0 0 3.5px var(--warning)}
}
.session-card-title{font-weight:600;font-size:12.5px;line-height:1.2;color:var(--text-primary)}
.session-card-meta{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:4px;margin-top:2px}

/* Conflict Cell Pulsing Highlight */
.cell-conflict-pulse{animation:pulseCell 1s infinite alternate!important}
@keyframes pulseCell{
  0%{background:var(--danger-subtle);outline:2.5px solid var(--danger);outline-offset:-2px}
  100%{background:transparent;outline:2.5px solid transparent;outline-offset:-2px}
}

/* Side Panel for Conflict Center */
.side-conflict-panel{
  width:350px;flex:none;background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:18px;position:sticky;top:calc(var(--topbar-height) + 18px);
  max-height:calc(100vh - var(--topbar-height) - 36px);overflow-y:auto;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:14px;
}
.conflict-card-item{
  background:var(--bg-app);border:1px solid var(--border-subtle);border-left:3.5px solid var(--danger);
  border-radius:var(--radius-md);padding:12px;cursor:pointer;transition:transform var(--timing-fast) ease,border-color var(--timing-fast) ease;
}
.conflict-card-item:hover{border-color:var(--danger);transform:translateX(-2px);box-shadow:var(--shadow-xs)}

/* Modal Dialog */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn 150ms ease;
}
.modal-box{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);
  padding:24px;width:100%;max-width:480px;box-shadow:var(--shadow-xl);animation:scaleIn 180ms var(--ease-smooth);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}

/* Dashboard Metric Cards */
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:20px 0}
.metric-tile{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:18px 20px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;justify-content:space-between;
}
.metric-tile-num{font-size:32px;font-weight:700;letter-spacing:-0.03em;color:var(--text-primary);line-height:1;margin:8px 0 4px}

/* Toast */
.toast-bar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text-primary);
  color:var(--text-inverse);padding:10px 18px;border-radius:var(--radius-full);font-size:13.5px;
  font-weight:500;box-shadow:var(--shadow-lg);display:none;z-index:999;align-items:center;gap:8px;
}

@media(max-width:960px){
  .sidebar{position:fixed;left:-260px;transition:left var(--timing-normal) ease}
  .sidebar.mobile-open{left:0}
  .tt-workspace{flex-direction:column}
  .side-conflict-panel{width:100%;position:static;max-height:none}
  .content-body{padding:20px 16px 60px}
}
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="app-sidebar" aria-label="Main Navigation">
    <div class="sidebar-header">
      <a href="/" class="brand-link" title="TESSellate Timetable Synchronization">
        <div class="brand-logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg>
        </div>
        <span class="brand-title">TESSellate</span>
      </a>
      <button class="btn btn-ghost btn-sm" id="btn-sidebar-collapse" onclick="toggleSidebar()" title="Toggle Sidebar" style="padding:4px;height:28px;width:28px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>

    <!-- 5 Core Navigation Sections -->
    <nav class="sidebar-nav" id="sidebar-nav-list">

<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>`${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}`;
const tomin=t=>+t.slice(0,2)*60+ +t.slice(3,5);

let me=null;
let V='dash'; // 'dash' | 'tt' | 'su' | 'ru' | 'se'
let S={
  selClass:null,
  classes:[],
  settings:null,
  ttEntries:[],
  pendingMoves:{},
  undoStack:[],
  conflicts:[],
  isValid:true,
  validating:false,
  subTab:'alloc',
  highlightedCells:new Set(),
  stuOff:null,
  searchQuery:''
};

// Theme Management
function initTheme(){
  const saved = localStorage.getItem('tess_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const nw = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nw);
  localStorage.setItem('tess_theme', nw);
  updateThemeIcon(nw);
}
function updateThemeIcon(th){
  const el = $('#theme-icon');
  if(!el) return;
  if(th==='dark'){
    el.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  } else {
    el.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
  }
}
initTheme();

function toggleSidebar(){
  const sb = $('#app-sidebar');
  sb.classList.toggle('collapsed');
}

async function api(p,o={}){
  const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status==401&&me){location.replace('/login.html')}
    const msg = typeof j.detail=='string'?j.detail:(j.detail&&j.detail.message)?j.detail.message:'Something went wrong.';
    throw new Error(msg);
  }
  return j;
}

function toast(t, good=true){
  const el=$('#toast');el.innerHTML=(good?'✓ ':'⚠ ')+esc(t);el.style.display='flex';
  clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',4000);
}

function nav(v){
  V=v;
  document.querySelectorAll('#sidebar-nav-list .nav-item').forEach(b => {
    b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false');
  });
  render();
}

async function init(){
  try{
    me = await api('/api/auth/me');
    $('#lbl-dept-name').textContent = me.department.name;
    $('#lbl-dept-cat').textContent = `${me.department.category} · 2026–27`;
    $('#hdr-category-badge').textContent = me.department.category;
    $('#hdr-category-badge').className = `badge ${me.department.category==='Aided'?'badge-brand':'badge-warning'}`;
    render();
  }catch(e){
    location.replace('/login.html');
  }
}

async function render(){
  const titles = {dash:'Dashboard', tt:'Timetable Editor', su:'Subjects & Curriculum', ru:'Scheduling Rules', se:'Settings'};
  $('#bc-title').textContent = titles[V] || 'Overview';
  const main = $('#main-content');
  main.innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--text-muted)">Loading...</div>`;
  try {
    if(V==='dash') main.innerHTML = await renderDashboard();
    else if(V==='tt') main.innerHTML = await renderTimetable();
    else if(V==='su') main.innerHTML = await renderSubjects();
    else if(V==='ru') main.innerHTML = await renderRules();
    else if(V==='se') main.innerHTML = await renderSettings();
  } catch(e){
    main.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <h3>Could not load section</h3>
      <p class="sub">${esc(e.message)}</p>
      <button class="btn btn-sm" onclick="render()">Try again</button>
    </div>`;
  }
}

/* =========================================================================
   MODULE 1: DASHBOARD
   ========================================================================= */
async function renderDashboard(){
  const [d, cf, audit] = await Promise.all([
    api('/api/dashboard'),
    api('/api/conflicts'),
    api('/api/audit')
  ]);
  const conflictCount = (cf.items||[]).length;
  const isGenerated = d.sessions > 0;

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:16px">
      <div>
        <div class="sm" style="text-transform:uppercase;letter-spacing:0.06em;font-weight:600;color:var(--brand)">Department Overview</div>
        <h1 style="margin-top:4px">${esc(d.department.name)}</h1>
        <p class="sub" style="margin:2px 0 0">Institutional Classification: <b>${esc(d.department.category)}</b> · Equal priority scheduling across shared college resources.</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="generateTimetable()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg> Generate Timetable</button>
        <button class="btn btn-primary" onclick="nav('tt')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/></svg> Open Timetable Editor</button>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric-tile">
        <div class="sm" style="font-weight:600">Total Subjects</div>
        <div class="metric-tile-num">${d.subjects||0}</div>
        <div class="sm">Course allocations</div>
      </div>
      <div class="metric-tile">
        <div class="sm" style="font-weight:600">Classes &amp; Sections</div>
        <div class="metric-tile-num">${d.classes||0}</div>
        <div class="sm">Student cohorts</div>
      </div>
      <div class="metric-tile">
        <div class="sm" style="font-weight:600">Total Faculty</div>
        <div class="metric-tile-num">${d.faculty||0}</div>
        <div class="sm">Assigned teachers</div>
      </div>
      <div class="metric-tile">
        <div class="sm" style="font-weight:600">Weekly Sessions</div>
        <div class="metric-tile-num">${d.sessions||0}</div>
        <div class="sm">Lectures &amp; labs placed</div>
      </div>
    </div>

    <div class="form-row" style="margin-top:20px;grid-template-columns:1.2fr 1fr">
      <div class="card">
        <div class="card-header">
          <div>
            <h3>Timetable Completion &amp; Health</h3>
            <p class="sub" style="margin:2px 0 0">College-wide resource synchronization status.</p>
          </div>
          <div>${isGenerated ? (conflictCount===0 ? '<span class="badge badge-success">✓ Synced &amp; Compliant</span>' : `<span class="badge badge-danger">⚠ ${conflictCount} Conflict(s)</span>`) : '<span class="badge badge-warning">Draft Mode</span>'}</div>
        </div>

        <div style="background:var(--bg-subtle);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-subtle);margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:13px">Constraint Verification</span>
            <span class="sm">${isGenerated ? (conflictCount===0 ? '100% Valid' : 'Needs attention') : 'Pending generation'}</span>
          </div>
          <div style="height:6px;background:var(--border-subtle);border-radius:3px;margin:8px 0;overflow:hidden">
            <div style="height:100%;width:${isGenerated?(conflictCount===0?100:60):20}%;background:${conflictCount>0?'var(--danger)':'var(--success)'}"></div>
          </div>
          <div class="sm" style="color:var(--text-muted)">
            ${conflictCount===0 ? 'No teacher, classroom or student clashes detected across college.' : `${conflictCount} scheduling clash(es) detected. Open the Timetable Editor to resolve them.`}
          </div>
        </div>

        <div style="display:flex;gap:10px">
          <button class="btn btn-sm btn-primary" onclick="nav('tt')">Launch Timetable Workspace →</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h3>Recent Timetable Updates</h3>
            <p class="sub" style="margin:2px 0 0">Latest audit records for this department.</p>
          </div>
        </div>
        ${audit&&audit.length ? `
          <div style="display:flex;flex-direction:column;gap:10px">
            ${audit.slice(0, 5).map(a => {
              const dt = a.at ? new Date(a.at).toLocaleDateString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Recent';
              const act = (a.action||'update').replace(/_/g,' ');
              return `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--border-subtle)">
                <div>
                  <div style="font-weight:600;font-size:13px;text-transform:capitalize">${esc(act)}</div>
                  <div class="sm">${a.reason ? esc(a.reason) : (a.new_value? 'Applied configuration changes' : 'System update')}</div>
                </div>
                <div class="sm mono" style="color:var(--text-muted);white-space:nowrap">${dt}</div>
              </div>`;
            }).join('')}

        ` : '<p class="sub">No recent activity recorded.</p>'}
      </div>
    </div>`;
}

/* =========================================================================
   MODULE 2: TIMETABLE EDITOR (Interactive Grid + Drag & Drop + Side Panel)
   ========================================================================= */
async function renderTimetable(){
  const [classes, st] = await Promise.all([
    api('/api/classes'),
    api('/api/settings')
  ]);
  S.classes = classes;
  S.settings = st.config;

  if(!classes.length){
    return `<div class="card" style="text-align:center;padding:50px">
      <h3>No Classes Found</h3>
      <p class="sub">Please create classes and subjects before opening the timetable editor.</p>
      <button class="btn btn-primary" onclick="nav('su')">Go to Subjects &amp; Classes</button>
    </div>`;
  }

  if(!S.selClass || !classes.some(c=>c.id==S.selClass)){
    S.selClass = classes[0].id;
    S.pendingMoves = {};
    S.undoStack = [];
    S.conflicts = [];
  }

  const rawEntries = await api(`/api/timetable/${S.selClass}`);
  S.ttEntries = rawEntries;

  // Build simulated grid reflecting pendingMoves
  const simulatedMap = {};
  rawEntries.forEach(e => { simulatedMap[e.id] = {...e}; });
  Object.values(S.pendingMoves).forEach(m => {
    if(simulatedMap[m.id]){
      if(m.deleted) delete simulatedMap[m.id];
      else {
        simulatedMap[m.id].day = m.day;
        simulatedMap[m.id].period = m.period;
        if(m.faculty_id !== undefined) simulatedMap[m.id].faculty_id = m.faculty_id;
        if(m.room_id !== undefined) simulatedMap[m.id].room_id = m.room_id;
      }
    }
  });

  const pendingCount = Object.keys(S.pendingMoves).length;
  const days = S.settings.days || [0,1,2,3,4];
  const periods = S.settings.periods || [];

  // Generate grid HTML
  let gridHtml = `
  <div class="table-container" style="border-radius:var(--radius-lg)">
    <table class="tt-grid-table" id="tt-grid">
      <thead>
        <tr>
          <th class="time-col">Period</th>
          ${days.map(d=>`<th>${DAYS[d]}</th>`).join('')}
        </tr>
      </thead>
      <tbody>`;

  periods.forEach((p, pIdx) => {
    gridHtml += `<tr>
      <td class="time-cell">
        <div style="font-weight:600;color:var(--text-primary)">P${pIdx+1}</div>
        <div class="sm">${p.start}</div>
        <div class="sm" style="color:var(--text-muted)">${p.end}</div>
      </td>`;

    days.forEach(d => {
      const cellSessions = Object.values(simulatedMap).filter(s => s.day == d && s.period == pIdx);
      const isFree = (S.settings.free||[]).some(f => f[0] == d && f[1] == pIdx);
      const isHighlighted = S.highlightedCells.has(`${d},${pIdx}`);

      gridHtml += `<td data-day="${d}" data-period="${pIdx}" class="${isHighlighted ? 'cell-conflict-pulse' : ''}" ondragover="onCellDragOver(event)" ondragleave="onCellDragLeave(event)" ondrop="onCellDrop(event, ${d}, ${pIdx})">`;

      if(cellSessions.length > 0){
        cellSessions.forEach(s => {
          const isPending = !!S.pendingMoves[s.id];
          const isMdc = s.entry_type === 'MDC';
          const isMinor = s.entry_type === 'Minor';
          const isLab = s.lab;
          const cardClass = isMdc ? 'card-mdc' : isMinor ? 'card-minor' : isLab ? 'card-lab' : '';

          gridHtml += `
            <div class="session-card ${cardClass} ${isPending?'pending-change':''}" draggable="true" data-id="${s.id}" ondragstart="onCardDragStart(event, ${s.id})" onclick="openSessionModal(${s.id})">
              <div>
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                  <div class="session-card-title">${esc(s.subject)}</div>
                  ${isPending ? '<span class="badge badge-warning" style="font-size:9.5px;padding:1px 5px">Moved</span>' : ''}
                </div>
                <div class="session-card-meta">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  ${esc(s.teacher)}
                </div>
                <div class="session-card-meta">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>
                  ${esc(s.room || '—')}
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
                <span class="badge ${isMdc?'badge-danger':isMinor?'badge-warning':'badge-neutral'}" style="font-size:10px">${isMdc?'MDC':isMinor?'Minor':(s.lab?'Lab':'Lecture')}</span>
              </div>
            </div>`;
        });
      } else {
        gridHtml += `<div class="sm" style="color:var(--text-tertiary);height:100%;display:flex;align-items:center;justify-content:center;opacity:0.4">${isFree ? 'Kept free' : 'Empty'}</div>`;
      }
      gridHtml += `</td>`;
    });
    gridHtml += `</tr>`;
  });

  gridHtml += `</tbody></table></div>`;

  // Right Side Conflict Center
  const conflictCount = S.conflicts.length;
  const statusPill = S.validating ?
    `<span class="badge badge-warning">Validating...</span>` :
    conflictCount === 0 ?
    `<span class="badge badge-success">✓ 0 Conflicts</span>` :
    `<span class="badge badge-danger">⚠ ${conflictCount} Conflict(s)</span>`;

  const sidePanelHtml = `
    <div class="side-conflict-panel" id="side-conflict-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:12px">
        <div>
          <h3 style="font-size:14px">Conflict Center</h3>
          <div class="sm">Real-time scheduling validation</div>
        </div>
        ${statusPill}
      </div>

      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="validateCurrentBatch()" style="flex:1">Re-check Schedule</button>
        <button class="btn btn-sm" onclick="clearHighlights()" title="Clear highlight rings">Clear</button>
      </div>

      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
        ${conflictCount === 0 ? `
          <div style="text-align:center;padding:36px 14px">
            <div style="width:40px;height:40px;border-radius:var(--radius-full);background:var(--success-subtle);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div style="font-weight:600;font-size:13.5px">Zero Conflicts Found</div>

// Drag & Drop Handlers
let draggedCardId = null;

function onCardDragStart(ev, id){
  draggedCardId = id;
  ev.dataTransfer.setData('text/plain', String(id));
  ev.dataTransfer.effectAllowed = 'move';
}

function onCellDragOver(ev){
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  const td = ev.target.closest('td[data-day]');
  if(td) td.classList.add('drag-target-over');
}

function onCellDragLeave(ev){
  const td = ev.target.closest('td[data-day]');
  if(td) td.classList.remove('drag-target-over');
}

async function onCellDrop(ev, targetDay, targetPeriod){
  ev.preventDefault();
  const td = ev.target.closest('td[data-day]');
  if(td) td.classList.remove('drag-target-over');

  const id = draggedCardId || +ev.dataTransfer.getData('text/plain');
  if(!id) return;

  const currentEntry = S.ttEntries.find(e => e.id == id);
  if(!currentEntry) return;

  const curDay = S.pendingMoves[id] ? S.pendingMoves[id].day : currentEntry.day;
  const curPeriod = S.pendingMoves[id] ? S.pendingMoves[id].period : currentEntry.period;

  if(curDay === targetDay && curPeriod === targetPeriod) return;

  // Check if session exists in target cell (swap)
  const existingInTarget = S.ttEntries.find(e => {
    const d = S.pendingMoves[e.id] ? S.pendingMoves[e.id].day : e.day;
    const p = S.pendingMoves[e.id] ? S.pendingMoves[e.id].period : e.period;
    return d === targetDay && p === targetPeriod && (!S.pendingMoves[e.id] || !S.pendingMoves[e.id].deleted);
  });

  // Record undo
  S.undoStack.push({
    movedId: id,
    prevDay: curDay,
    prevPeriod: curPeriod,
    swappedId: existingInTarget ? existingInTarget.id : null,
    swapPrevDay: targetDay,
    swapPrevPeriod: targetPeriod
  });

  S.pendingMoves[id] = {
    id: id,
    day: targetDay,
    period: targetPeriod,
    faculty_id: currentEntry.faculty_id,
    room_id: currentEntry.room_id
  };

  if(existingInTarget){
    S.pendingMoves[existingInTarget.id] = {
      id: existingInTarget.id,
      day: curDay,
      period: curPeriod,
      faculty_id: existingInTarget.faculty_id,
      room_id: existingInTarget.room_id
    };
    toast(`Swapped ${currentEntry.subject} with ${existingInTarget.subject}`);
  } else {
    toast(`Moved ${currentEntry.subject} to ${DAYS[targetDay]} P${targetPeriod+1}`);
  }

  validateCurrentBatch(false);
  render();
}

function undoLastMove(){
  if(!S.undoStack.length) return;
  const step = S.undoStack.pop();

  if(step.movedId){
    const orig = S.ttEntries.find(e => e.id == step.movedId);
    if(orig && orig.day === step.prevDay && orig.period === step.prevPeriod){
      delete S.pendingMoves[step.movedId];
    } else {
      S.pendingMoves[step.movedId] = { id: step.movedId, day: step.prevDay, period: step.prevPeriod };
    }
  }

  if(step.swappedId){
    const origSwap = S.ttEntries.find(e => e.id == step.swappedId);
    if(origSwap && origSwap.day === step.swapPrevDay && origSwap.period === step.swapPrevPeriod){
      delete S.pendingMoves[step.swappedId];
    } else {
      S.pendingMoves[step.swappedId] = { id: step.swappedId, day: step.swapPrevDay, period: step.swapPrevPeriod };
    }
  }

  toast('Undid last move');
  validateCurrentBatch(false);
  render();
}

function discardAllEdits(){
  if(!confirm('Discard all pending moves and restore original schedule?')) return;
  S.pendingMoves = {};
  S.undoStack = [];
  S.conflicts = [];
  S.highlightedCells.clear();
  toast('Unsaved changes discarded');
  render();
}

async function validateCurrentBatch(showNotification=true){
  S.validating = true;
  try{
    const moves = Object.values(S.pendingMoves);
    const res = await api('/api/timetables/validate-batch', {
      method: 'POST',
      body: { class_id: S.selClass, moves }
    });
    S.isValid = res.valid;
    S.conflicts = res.items || [];
    if(showNotification){
      if(res.valid) toast('Schedule is valid with zero conflicts!', true);
      else toast(`Detected ${S.conflicts.length} conflict(s).`, false);
    }
  } catch(e){
    toast(e.message, false);
  } finally {
    S.validating = false;
    updateSideConflictPanel();
  }
}

function updateSideConflictPanel(){
  const panel = $('#side-conflict-panel');
  if(!panel) return;
  const conflictCount = S.conflicts.length;
  const statusPill = S.validating ?
    `<span class="badge badge-warning">Validating...</span>` :
    conflictCount === 0 ?
    `<span class="badge badge-success">✓ 0 Conflicts</span>` :
    `<span class="badge badge-danger">⚠ ${conflictCount} Conflict(s)</span>`;

  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:12px">
      <div>
        <h3 style="font-size:14px">Conflict Center</h3>
        <div class="sm">Real-time scheduling validation</div>
      </div>
      ${statusPill}
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-sm btn-primary" onclick="validateCurrentBatch()" style="flex:1">Re-check Schedule</button>
      <button class="btn btn-sm" onclick="clearHighlights()" title="Clear highlight rings">Clear</button>
    </div>

    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
      ${conflictCount === 0 ? `
        <div style="text-align:center;padding:36px 14px">
          <div style="width:40px;height:40px;border-radius:var(--radius-full);background:var(--success-subtle);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div style="font-weight:600;font-size:13.5px">Zero Conflicts Found</div>
          <p class="sm" style="margin-top:4px">All teacher assignments, rooms, and enrolled students are aligned.</p>
        </div>
      ` : `
        <div class="sm" style="color:var(--text-muted)">Click any conflict card to highlight conflicting cells:</div>
        ${S.conflicts.map(c => `
          <div class="conflict-card-item" onclick="highlightCells(${JSON.stringify(c.cells||[]).replace(/"/g,'&quot;')})">
            <div style="font-weight:600;font-size:12.5px;color:var(--danger)">${esc(c.issue)}</div>
            <div class="sm" style="margin-top:4px"><b>Fix:</b> ${esc(c.fix)}</div>
          </div>
        `).join('')}
      `}
    </div>`;
}

function highlightCells(cells){
  S.highlightedCells.clear();
  (cells||[]).forEach(c => S.highlightedCells.add(`${c.day},${c.period}`));
  document.querySelectorAll('#tt-grid td[data-day]').forEach(td => {
    const d = +td.dataset.day, p = +td.dataset.period;
    if(S.highlightedCells.has(`${d},${p}`)){
      td.classList.add('cell-conflict-pulse');
      td.scrollIntoView({behavior:'smooth', block:'nearest'});
    } else {
      td.classList.remove('cell-conflict-pulse');
    }
  });
}

function clearHighlights(){
  S.highlightedCells.clear();
  document.querySelectorAll('#tt-grid td.cell-conflict-pulse').forEach(td => {
    td.classList.remove('cell-conflict-pulse');
  });
}

async function saveBatchEdits(){
  if(S.conflicts.length > 0){
    if(!confirm(`There are ${S.conflicts.length} conflict(s) detected. The backend requires zero conflicts to save. Try saving anyway?`)){
      return;
    }
  }
  const moves = Object.values(S.pendingMoves);
  try{
    const res = await api('/api/timetables/save-batch', {
      method: 'POST',
      body: { class_id: S.selClass, moves }
    });
    toast(res.message || 'Timetable saved successfully!', true);
    S.pendingMoves = {};
    S.undoStack = [];
    S.conflicts = [];
    S.highlightedCells.clear();
    render();
  } catch(e){
    toast(e.message, false);
    validateCurrentBatch(false);
  }
}

function onClassChange(cid){
  if(Object.keys(S.pendingMoves).length > 0){
    if(!confirm('You have unsaved moves for this class. Discard them?')){
      $('#tt-class-dropdown').value = S.selClass;
      return;
    }
  }
  S.selClass = +cid;
  S.pendingMoves = {};
  S.undoStack = [];
  S.conflicts = [];
  render();
}

          `).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">No course offerings created yet.</td></tr>'}
        </tbody>
      </table>
    </div>`;
}

        <div style="margin-top:14px;background:var(--bg-subtle);padding:14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)">

            <span class="badge ${curOff.selection_type==='STUDENT_SELECTED'?'badge-brand':'badge-neutral'}">${curOff.selection_type==='STUDENT_SELECTED'?'College-Wide Enrollment':'Home Dept Restricted'}</span>
          </div>
          <div style="height:6px;background:var(--border-subtle);border-radius:3px;margin:8px 0;overflow:hidden">
            <div style="height:100%;width:${Math.min(100, Math.round((enr.total_enrolled/curOff.max_enrollment)*100))}%;background:var(--brand)"></div>

          <div class="form-row" style="margin-top:12px">
            <div>
              <label>Select Student to Enroll</label>
              <select id="enr_stu_id">
                ${students.map(s=>`<option value="${s.id}">${esc(s.register_number)} · ${esc(s.name)} (${esc(s.class_name||'Unassigned')})</option>`).join('')}
              </select>
            </div>
            ${(curOff.sections&&curOff.sections.length)?`
            <div>
              <label>Section</label>
              <select id="enr_sec_id">
                <option value="">Default section</option>
                ${curOff.sections.map(sec=>`<option value="${sec.id}">Section ${esc(sec.section_name)} (Cap ${sec.capacity})</option>`).join('')}
              </select>
            </div>`:''}
            <div style="display:flex;align-items:flex-end">
              <button class="btn btn-primary btn-sm" onclick="submitEnrollStudent()">Enroll Student</button>
            </div>
          </div>
        </div>

    <div class="table-container">
      <table class="data-table">
        <thead><tr><th>Register Number</th><th>Student Name</th><th>Home Department</th><th>Cohort</th><th>Action</th></tr></thead>
        <tbody>
          ${enr.enrolled.length ? enr.enrolled.map(e=>`
            <tr>
              <td class="mono"><b>${esc(e.register_number)}</b></td>
              <td><b>${esc(e.name)}</b></td>
              <td>${esc(e.home_department)}</td>
              <td>${esc(e.class_name || '—')}</td>
              <td><button class="btn btn-sm btn-danger" onclick="unenrollStudent(${curOff.id}, ${e.student_id})">Unenroll</button></td>
            </tr>
          `).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">No students enrolled yet.</td></tr>'}

/* =========================================================================
   MODULE 4: RULES (Working days, Periods, Break timings, Common Slots)
   ========================================================================= */
async function renderRules(){
  if(!S.rcfg){
    const r = await api('/api/settings');
    S.rcfg = JSON.parse(JSON.stringify(r.config));
    S.rdefs = r.rule_defs;
    S.rstale = r.stale;
  }
  const c = S.rcfg;
  const commonSlots = await api('/api/common-slots');

  const daysCheckboxes = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px">
      ${[0,1,2,3,4,5,6].map(d=>`
        <button type="button" class="btn btn-sm ${c.days.includes(d)?'btn-primary':''}" onclick="toggleDay(${d})">
          ${DAYS[d].slice(0,3)}
        </button>
      `).join('')}
    </div>`;

  let perRows = '';
  c.periods.forEach((p, i) => {
    const prev = c.periods[i-1];
    if(prev && tomin(p.start) > tomin(prev.end)){
      perRows += `<tr class="gapnote"><td></td><td colspan="3" class="sm" style="color:var(--warning)">Break · ${tomin(p.start)-tomin(prev.end)} min</td></tr>`;
    }
    perRows += `<tr>
      <td><b>P${i+1}</b></td>
      <td><input type="time" data-pt="${i}:start" value="${p.start}"></td>
      <td><input type="time" data-pt="${i}:end" value="${p.end}"></td>
      <td><button class="btn btn-sm btn-danger" onclick="removePeriod(${i})" ${c.periods.length<2?'disabled':''}>Remove</button></td>
    </tr>`;
  });

  const freeGrid = `
    <div class="table-container"><table class="data-table" style="min-width:440px">
      <thead><tr><th></th>${c.days.map(d=>`<th>${DAYS[d].slice(0,3)}</th>`).join('')}</tr></thead>
      <tbody>
        ${c.periods.map((p, i)=>`
          <tr>
            <td class="mono sm"><b>${p.start}</b></td>
            ${c.days.map(d=>{
              const on = (c.free||[]).some(f=>f[0]==d && f[1]==i);
              return `<td style="height:44px;text-align:center;vertical-align:middle">
                <button type="button" class="btn btn-sm ${on?'btn-danger':'btn-ghost'}" onclick="toggleFreeSlot(${d}, ${i})" style="width:90%">
                  ${on?'Kept Free':'Open'}
                </button>
              </td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table></div>`;

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h1>Timetable Rules &amp; Schedule Policies</h1>
        <p class="sub">Configure working days, period timings, breaks, kept-free periods, and college-wide common time slots.</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="saveAllRules()">Save Rules</button>
      </div>
    </div>

    ${S.rstale ? `<div class="card" style="border-left:4px solid var(--warning);margin-bottom:20px"><b>Notice:</b> Schedule settings changed. Regenerate timetable to apply.</div>` : ''}

    <div class="form-row" style="grid-template-columns:1.2fr 1fr">
      <div>
        <div class="card" style="margin-bottom:20px">
          <h3>Active Teaching Days</h3>
          <p class="sub">Select working days for your department.</p>
          ${daysCheckboxes}

          <h3>Teaching Periods &amp; Breaks</h3>
          <p class="sub">Configured daily period times. Gaps between periods become scheduled breaks.</p>
          <div class="table-container" style="margin-top:12px">
            <table class="data-table">
              <thead><tr><th>Period</th><th>Start</th><th>End</th><th>Action</th></tr></thead>
              <tbody>${perRows}</tbody>
            </table>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px">
            <button class="btn btn-sm" onclick="addPeriod()">+ Add Period</button>
            <button class="btn btn-sm" onclick="presetPeriods()">Reset to Standard 6 Periods</button>
          </div>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:20px">
          <h3>Kept-Free Periods</h3>
          <p class="sub">Mark periods that no class in this department should use.</p>
          ${freeGrid}
        </div>

        <div class="card">
          <h3>College-Wide Common Slots</h3>
          <p class="sub">Fixed synchronized periods for student-selected MDC &amp; Minor courses.</p>
          <div class="table-container" style="margin-top:12px">
            <table class="data-table">
              <thead><tr><th>Day</th><th>Time</th><th>Course Type</th><th>Slot Name</th></tr></thead>
              <tbody>
                ${commonSlots.length ? commonSlots.map(cs=>`
                  <tr>
                    <td><b>${DAYS[cs.day]}</b></td>
                    <td class="mono">${cs.start}–${cs.end}</td>
                    <td><span class="badge ${cs.applicable_course_type==='MDC'?'badge-danger':cs.applicable_course_type==='Minor'?'badge-warning':'badge-success'}">${cs.applicable_course_type}</span></td>
                    <td>${esc(cs.name)}</td>
                  </tr>
                `).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">No common slots configured.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
}

/* =========================================================================
   MODULE 5: SETTINGS
   ========================================================================= */

  const audit = await api('/api/audit');
  return `
    <div style="margin-bottom:24px">
      <h1>Settings &amp; Preferences</h1>
      <p class="sub">Department profile, credentials, and institutional synchronization details.</p>
    </div>

    <div class="form-row" style="grid-template-columns:1.2fr 1fr">
      <div>
        <div class="card" style="margin-bottom:20px">
          <h3>Department Profile</h3>
          <p class="sub">Institutional classification and credentials.</p>
          <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)">
              <span class="sm">Department Name</span>
              <b>${esc(me.department.name)}</b>
            </div>
            <div style="display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)">
              <span class="sm">Department Code</span>
              <span class="mono"><b>${esc(me.department.code)}</b></span>
            </div>
            <div style="display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)">
              <span class="sm">Username</span>
              <span class="mono">${esc(me.username)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)">
              <span class="sm">Institutional Category</span>
              <span class="badge ${me.department.category==='Aided'?'badge-brand':'badge-warning'}">${esc(me.department.category)}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span class="sm">Scheduling Priority</span>
              <b>Equal Priority (College-Wide Synchronization)</b>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Security &amp; Password</h3>
          <p class="sub">Update your department password.</p>
          <form onsubmit="onUpdatePassword(event)" style="margin-top:16px">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" id="pw_cur" required>
            </div>
            <div class="form-group">
              <label>New Password (10+ characters, letters &amp; numbers)</label>
              <input type="password" id="pw_new" required>
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <input type="password" id="pw_cnf" required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Update Password</button>
          </form>
        </div>
      </div>

      <div>
        <div class="card">
          <h3>Audit Log History</h3>
          <p class="sub">Logged actions for this department.</p>
          <div style="max-height:480px;overflow-y:auto;margin-top:14px">
            <table class="data-table">
              <thead><tr><th>Time</th><th>Action</th><th>Detail</th></tr></thead>
              <tbody>
                ${audit&&audit.length ? audit.map(a => {
                  const dt = a.at ? new Date(a.at).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Recent';
                  return `<tr>
                    <td class="sm mono">${dt}</td>
                    <td><b>${esc((a.action||'').replace(/_/g,' '))}</b></td>
                    <td class="sm">${a.reason ? esc(a.reason) : (a.new_value? JSON.stringify(a.new_value) : '—')}</td>
                  </tr>`;
                }).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">No audit entries.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
}

// Action Handlers
async function generateTimetable(){
  try{
    const res = await api('/api/generate', { method:'POST', body:{} });
    if(res.status==='ok') toast(`Timetable generated successfully! Quality: ${res.quality}%`, true);
    else toast(res.message || 'Could not place all sessions', false);
    S.pendingMoves = {};
    S.undoStack = [];
    S.conflicts = [];
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function submitAddAlloc(){
  const body = {
    class_id: +$('#alloc_cls').value,
    subject: $('#alloc_sub').value.trim(),
    sessions: +$('#alloc_ses').value,
    faculty_id: +$('#alloc_fac').value
  };

  try{
    await api('/api/allocations', { method:'POST', body });
    toast('Subject allocated successfully');
    render();
  } catch(e){
    toast(e.message, false);
  }
}

async function submitAddCourse(){
  const body = {
    course_code: $('#crs_code').value.trim().toUpperCase(),
    course_name: $('#crs_name').value.trim(),
    course_type: $('#crs_type').value,
    selection_type: $('#crs_sel').value
  };

  try{
    await api('/api/courses', { method:'POST', body });
    toast('Course created in catalog');
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function submitAddOffering(){
  const body = {
    course_id: +$('#off_crs').value,
    offering_code: $('#off_code').value.trim().toUpperCase(),
    required_sessions: +$('#off_ses').value,
    max_enrollment: +$('#off_cap').value,
    faculty_id: +$('#off_fac').value,

  };

    await api('/api/offerings', { method:'POST', body });

async function addSectionPrompt(offId){
  const name = prompt('Section Name (e.g. B, C):', 'B');
  if(!name) return;
  const cap = +prompt('Section Capacity:', '30') || 30;
  try{
    await api(`/api/offerings/${offId}/sections`, { method:'POST', body:{ section_name: name.toUpperCase(), capacity: cap }});
    toast(`Section ${name} created`);
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function deleteOffering(offId){
  if(!confirm('Permanently remove this course offering?')) return;
  try{
    await api(`/api/offerings/${offId}`, { method:'DELETE' });
    toast('Offering removed');
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function submitEnrollStudent(){
  const sid = +$('#enr_stu_id').value;
  const secEl = $('#enr_sec_id');
  const secId = secEl ? (+secEl.value || null) : null;
  try{
    await api(`/api/offerings/${S.stuOff}/enrollments`, { method:'POST', body:{ student_id: sid, section_id: secId }});
    toast('Student enrolled');
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function unenrollStudent(offId, stuId){
  if(!confirm('Unenroll student from offering?')) return;
  try{
    await api(`/api/offerings/${offId}/enrollments/${stuId}`, { method:'DELETE' });
    toast('Student unenrolled');
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function submitAddClass(){
  const body = {
    name: $('#cls_name').value.trim(),
    semester: +$('#cls_sem').value,
    section: $('#cls_sec').value.trim().toUpperCase() || 'A',
    students: +$('#cls_stu').value || null
  };
  if(!body.name) return toast('Please enter class name', false);
  try{
    await api('/api/classes', { method:'POST', body });
    toast('Class added');
    render();
  }catch(e){
    toast(e.message, false);
  }
}

function toggleDay(d){
  if(S.rcfg.days.includes(d)) S.rcfg.days = S.rcfg.days.filter(x => x !== d);
  else S.rcfg.days = [...S.rcfg.days, d].sort();
  render();
}

function toggleFreeSlot(d, p){
  if(!S.rcfg.free) S.rcfg.free = [];
  const idx = S.rcfg.free.findIndex(f => f[0] == d && f[1] == p);
  if(idx >= 0) S.rcfg.free.splice(idx, 1);
  else S.rcfg.free.push([d, p]);
  render();
}

function addPeriod(){
  const last = S.rcfg.periods[S.rcfg.periods.length - 1];
  const start = last ? last.end : '09:00';
  const endM = tomin(start) + 60;
  S.rcfg.periods.push({ start: start, end: hm(endM) });
  render();
}

function removePeriod(i){
  S.rcfg.periods.splice(i, 1);
  render();
}

function presetPeriods(){
  S.rcfg.periods = [
    {start:'09:00', end:'10:00'},
    {start:'10:00', end:'11:00'},
    {start:'11:15', end:'12:15'},
    {start:'12:15', end:'13:15'},
    {start:'14:00', end:'15:00'},
    {start:'15:00', end:'16:00'}
  ];
  render();
}

async function saveAllRules(){
  document.querySelectorAll('input[data-pt]').forEach(inp => {
    const [idx, field] = inp.dataset.pt.split(':');
    S.rcfg.periods[+idx][field] = inp.value;
  });
  try{
    await api('/api/settings', { method:'PUT', body: S.rcfg });
    S.rstale = true;
    toast('Rules and period timings saved', true);
    render();
  }catch(e){
    toast(e.message, false);
  }
}

async function onUpdatePassword(ev){
  ev.preventDefault();
  const cur = $('#pw_cur').value;
  const nw = $('#pw_new').value;
  const cnf = $('#pw_cnf').value;
  if(nw !== cnf) return toast('Passwords do not match', false);
  try{
    await api('/api/auth/change-password', { method:'POST', body:{ current: cur, new: nw }});
    toast('Password updated successfully', true);
    $('#pw_cur').value = ''; $('#pw_new').value = ''; $('#pw_cnf').value = '';
  }catch(e){
    toast(e.message, false);
  }
}

async function logout(){
  if(!confirm('Sign out of your department workspace?')) return;
  await api('/api/auth/logout', { method:'POST' });
  location.replace('/login.html');
}

// Start
init();
</script>
